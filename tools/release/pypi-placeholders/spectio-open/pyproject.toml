[project]
name = "spectio-open"
version = "0.0.0"
description = "Open edition of Spectio, the run monitor for Nextflow and Snakemake (early placeholder release)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = ["Development Status :: 1 - Planning"]

[project.scripts]
spectio-open = "spectio_open:main"

[project.urls]
Repository = "https://github.com/weber8thomas/spectio"
Documentation = "https://weber8thomas.github.io/spectio/"

[build-system]
requires = ["uv_build==0.11.32"]  # = UV_VERSION in dev/versions.env
build-backend = "uv_build"
