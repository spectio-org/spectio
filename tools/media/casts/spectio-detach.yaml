# Batch P3-B05, FU-P3-44: `spectio serve --detach` in the tmux session spectio-server, run for real
# from the repository's .venv, with a real tmux (3.4 when this was made) and a socket of its own
# (TMUX_TMPDIR inside the demo home).
# Same setup as the spectio-serve cast: a demo HOME (shown as ~) with a demo TMPDIR inside it
# (shown as $TMPDIR), fake nextflow and snakemake scripts, a demo host name in its own UTS
# namespace:
#   unshare --uts sh -c 'hostname demo-hpc-login1 && python3 tools/media/cast.py tools/media/casts/spectio-detach.yaml'
# Port 18092. The ticket is random, so each command that would print one masks it with a visible
# sed; the exit code of --detach is read before the sed with PIPESTATUS. The user name in the
# start text is replaced by the demo user alice (the cast generator runs as root).
# Needs `uv sync` first (the .venv of the checkout) and tmux on PATH.
title: "FU-P3-44: spectio serve --detach (tmux session spectio-server, link in the calling terminal)"
cols: 140
rows: 34
idle_time_limit: 1.5
typing_delay: 0.03
line_delay: 0.04
workdir: tmp
env:
  HOME: "{workdir}"
  TMPDIR: "{workdir}/.tmp"
  TMUX_TMPDIR: "{workdir}/.tmp"
  PATH: "{repo}/.venv/bin:$PATH"
setup:
  - |
    chmod 700 .
    mkdir -m 700 .tmp
    mkdir bin
    printf '#!/bin/sh\necho "nextflow version 26.10.4 (fake, for this cast)"\n' > bin/nextflow
    printf '#!/bin/sh\necho "9.27.1"\n' > bin/snakemake
    chmod +x bin/nextflow bin/snakemake
    echo 'export PATH="$HOME/bin:$PATH"' > .bash_profile
replace:  # applied in order, after the two {workdir} keys, which cast.py puts first
  "{workdir}/": "~/"
  "{workdir}": "~"
  "~/.tmp": "$TMPDIR"
  "root@": "alice@"
steps:
  - comment: "1. init in local mode, on a port of its own"
  - run: "spectio init --local --port 18092"
    drop: "^warning: nf-spectio not unpacked"
  - pause: 0.8
  - clear: true
  - comment: "2. --detach starts the server in a tmux session and prints the link here, not in the pane"
  - run: "spectio serve --detach 2>&1 | sed -E 's/#[A-Za-z0-9_-]{43}/#<ticket>/'; echo \"exit ${PIPESTATUS[0]}\""
  - pause: 1.5
  - run: "tmux list-sessions -F '#{session_name}: #{session_windows} window, attached #{session_attached}'"
  - pause: 1.0
  - comment: "3. the pane holds the log and no link"
  - run: "tmux capture-pane -p -t =spectio-server: | grep -c 'auth/link' || true"
  - pause: 1.0
  - clear: true
  - comment: "4. a second --detach starts nothing: it asks the running server for a new link"
  - run: "spectio serve --detach 2>&1 | sed -E 's/#[A-Za-z0-9_-]{43}/#<ticket>/'; echo \"exit ${PIPESTATUS[0]}\""
  - run: "tmux list-sessions -F '#{session_name}'"
  - pause: 1.5
  - comment: "5. --wait and --no-link mean nothing without --detach: exit 2"
  - run: "spectio serve --wait 5; echo \"exit $?\""
  - pause: 1.2
  - clear: true
  - comment: "6. the stop: killing the session sends SIGHUP, which the server treats as SIGTERM"
  - run: "tmux kill-session -t =spectio-server; sleep 2; ls ~/.spectio"
  - pause: 1.5
