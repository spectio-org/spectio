# The config keys workflow/Snakefile reads (config.setdefault), for Spectio's launch form, which
# reads this file (api/workflows.py SMK_SCHEMAS). The Snakefile does not validate against it.
# The same groups as ../../nextflow/nextflow_schema.json, with Snakemake's names: samples, fail_rule.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: synthetic-scenarios (Snakemake) config
description: Synthetic three-stage pipeline with gate points and failure injection for Spectio tests
type: object
$defs:
  input_output_options:
    title: Input/output options
    type: object
    fa_icon: fas fa-terminal
    description: The samplesheet the pipeline reads and where it writes its results.
    properties:
      samples:
        type: string
        format: file-path
        pattern: '^\S+\.csv$'
        description: "Samplesheet: a CSV file with the columns sample, group, replicate and n_reads."
        help_text: "Left unset, the pipeline reads data/samplesheet.csv next to its directory: 12 samples in the groups ctrl, A and B."
      outdir:
        type: string
        default: results
        description: The output directory, relative to the launch directory or absolute.
  scenario_options:
    title: Scenario
    type: object
    fa_icon: fas fa-dna
    description: "How much work the synthetic data makes: the fan-out of align and the number of samples."
    properties:
      chunks:
        type: integer
        default: 0
        minimum: 0
        description: "align jobs per sample: split cuts each sample's reads into this many chunks."
        help_text: "0 is dynamic: one chunk per 100 reads, so a sample of 400 reads gets 4."
      scale:
        type: integer
        default: 1
        minimum: 1
        description: "Above 1, adds (scale - 1) x 12 synthetic ctrl samples X0001… of 400 reads each, to stress the fan-out."
      seed:
        type: integer
        default: 42
        description: "Seed of the synthetic reads: the same seed gives the same reads and results."
  failure_injection:
    title: Failure injection
    type: object
    fa_icon: fas fa-exclamation-triangle
    description: Make one rule fail, to watch a failure, a retry or a resume.
    properties:
      fail_mode:
        type: string
        default: none
        enum: [none, exit, oom, oom_once, oom_real, timeout, flaky]
        description: How the chosen rule fails.
        help_text: "exit: exits 1. oom: killed as by an out-of-memory kill (exit 137), every attempt. oom_once: the same on the first attempt only, so the retry succeeds. oom_real: really allocates fail_gb GiB, for a scheduler's memory limit to kill. timeout: runs past the time limit. flaky: exits 1 on the first attempt only. Run with --retries 2 (the local and slurm profiles do) for the retries."
      fail_rule:
        type: string
        default: ""
        enum: ["", make_reads, qc_stats, qc_report, split, align, merge, compare, final_report]
        description: The rule that fails. Nothing fails while it is empty or fail_mode is none.
      fail_sample:
        type: string
        default: ""
        description: "Fail only the job of this sample (such as S03), or of this group for compare (such as A); empty: every job of the rule."
      fail_gb:
        type: integer
        default: 2
        minimum: 1
        description: GiB that fail_mode oom_real allocates.
  resources:
    title: Resources
    type: object
    fa_icon: fas fa-microchip
    description: "Limits of each job: 512 MB, times the attempt."
    properties:
      time_limit_s:
        type: integer
        default: 120
        minimum: 1
        description: "Time limit of a job's first attempt, in seconds; a retry gets twice as much, then three times."
allOf:
  - $ref: "#/$defs/input_output_options"
  - $ref: "#/$defs/scenario_options"
  - $ref: "#/$defs/failure_injection"
  - $ref: "#/$defs/resources"
