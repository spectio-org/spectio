# Real pipelines Spectio is tested against, with their own test datasets.
# Sources and verification: docs/research/corpus-and-ci-2026-10-26.md; CI results and tier moves: docs/research/corpus-ci-2026-10-27.md
# tier: pr = every PR (smoke subset, must fit a GitHub runner), nightly = scheduled matrix, manual = on demand.
# gate: the review gate Spectio puts on this pipeline in tests (see docs/specs/checking-scenarios.md).
# Optional keys: env (nf-core: extra environment), args (extra command-line arguments), snakefile (catalog; default
# workflow/Snakefile), network (external services the test data needs), note (why an entry is where it is).
versions:
  nextflow: {current: "26.10.3", previous: "25.10.9"}
  snakemake: "9.27.1"
  snakemake_executor_plugin_slurm: "2.8.0"
  java: "21"

runner_limits:
  # Measured on the private-repo ubuntu-latest runner (ubuntu-26.04 image, T7, 2026-10-27): 2 CPU, MemTotal 7.75 GB,
  # 6.9 GB available before a run, 3 GB swap; Nextflow's local executor sees 7.7 GB. 6 GB leaves room for the Nextflow
  # JVM and Docker, and two 6 GB tasks never run together. Public runners (4 CPU / 16 GB) are not measured yet.
  private: {cpus: 2, memory: "6.GB", time: "2.h"}
  public:  {cpus: 4, memory: "15.GB", time: "2.h"}

nfcore:
  - {name: demo,                  version: 1.2.0,  min_nf: 25.10.4, tier: pr,      class: run-only,          gate: "after MULTIQC: sample QC table"}
  - {name: rnaseq,                version: 3.27.0, min_nf: 25.10.4, tier: pr,      class: bulk-groups,       gate: "Mapping QC after alignment; exclude a sample and resume"}
  # viralrecon 3.0.0 and methylseq 4.2.0 include config files that are absent from their tags. The strict config parser,
  # the default since Nextflow 26.04, rejects that; the v1 parser does not (nf-core/viralrecon#606, nf-core/methylseq#607).
  - {name: viralrecon,            version: 3.0.0,  min_nf: 25.04.0, tier: pr,      class: assembly,          gate: "per-sample coverage and consensus Ns", env: {NXF_SYNTAX_PARSER: v1}}
  - {name: methylseq,             version: 4.2.0,  min_nf: 25.04.0, tier: pr,      class: bulk-samples,      gate: "bisulfite conversion rate", env: {NXF_SYNTAX_PARSER: v1}}
  - {name: molkart,               version: 1.2.0,  min_nf: 25.04.0, tier: pr,      class: imaging-spots,     gate: "spot and segmentation counts per image"}
  - {name: fetchngs,              version: 1.13.0, min_nf: 25.10.4, tier: nightly, class: run-only,          gate: "run-level", network: [ena, sra]}
  - {name: sarek,                 version: 3.10.0, min_nf: 25.10.4, tier: nightly, class: variants-pairs,    gate: "coverage after mosdepth; tumour/normal pairing"}
  - {name: scrnaseq,              version: 4.2.0,  min_nf: 25.10.4, tier: nightly, class: cells,             gate: "cell thresholds per sample"}
  - {name: mhcquant,              version: 3.3.0,  min_nf: 25.10.4, tier: nightly, class: ms-runs,           gate: "identification rate per MS run"}
  - {name: differentialabundance, version: 2.0.0,  min_nf: 25.10.4, tier: nightly, class: contrasts,         gate: "samples per contrast"}
  - {name: mag,                   version: 5.5.0,  min_nf: 26.04.0, tier: nightly, class: bins,              gate: "MIMAG rule on bins"}
  - {name: ampliseq,              version: 3.0.0,  min_nf: 26.04.0, tier: nightly, class: amplicon-taxa,     gate: "read retention after DADA2", args: "--config_profile_contact none --config_profile_url none", note: "typed params: Nextflow 26.10 stops when these two are unset"}
  - {name: taxprofiler,           version: 2.0.1,  min_nf: 25.10.4, tier: nightly, class: taxa,              gate: "host fraction and contaminants"}
  - {name: mcmicro,               version: 2.0.0,  min_nf: 25.04.0, tier: manual,  class: imaging-cells,     gate: "segmentation QC per ROI"}

snakemake_catalog:
  # The two RNA-seq workflows query the Ensembl archive through biomaRt; --retries rides out short timeouts.
  - {repo: snakemake-workflows/rna-seq-star-deseq2,        tag: v3.1.2,  submodules: true,  directory: .test, args: "--sdm conda --cores 2 --retries 2 --configfile .test/config_basic/config.yaml", tier: pr, class: bulk-groups, network: [ensembl]}
  - {repo: snakemake-workflows/dna-seq-gatk-variant-calling, tag: v2.1.1, submodules: false, directory: .test, args: "--sdm conda --cores 2",                                         tier: manual,  class: variants, note: "latest tag; its samtools/faidx wrapper (0.74.0) pins samtools 1.10, which conda can no longer solve"}
  - {repo: snakemake-workflows/rna-seq-kallisto-sleuth,    tag: v4.1.1,  submodules: true,  directory: .test, args: "--sdm conda --cores 2 --retries 2 --all-temp",                   tier: manual,  class: bulk-groups, network: [ensembl], note: "get_transcript_info times out on the Ensembl archive in every CI run so far"}
  - {repo: snakemake-workflows/dna-seq-varlociraptor,      tag: v6.11.3, submodules: false, directory: .test, args: "--configfile .test/config-simple/config.yaml --sdm conda --cores 2 --resources mem_mb=7000", tier: nightly, class: variants-pairs}
  - {repo: snakemake-workflows/single-cell-rna-seq,        tag: v1.1.0,  submodules: false, directory: .test, snakefile: Snakefile, args: "--sdm conda --cores 2",                    tier: manual,  class: cells, note: "unmaintained since 2019 (Travis CI, tensorflow 1.10 pins); nf-core/scrnaseq covers the class"}
  # chipseq has no release tag: pinned to a commit of its default branch, master.
  - {repo: snakemake-workflows/chipseq,                    tag: 1345df8a53e59772486dcd9a6dde4437a97ae6ed, submodules: true, directory: .test, args: "--configfile .test/config_single_end_reduced/config.yaml --sdm conda --cores 2", tier: manual, class: bulk-samples, note: "its cutadapt wrapper (0.64.0) pins cutadapt 2.10, which conda can no longer solve"}
  - {repo: snakemake-workflows/cyrcular-calling,           tag: v2.1.1,  submodules: false, directory: .test, args: "--configfile .test/config/config.yaml --sdm conda --cores 2", tier: manual,  class: long-reads, note: "the RepeatMasker hg38 download its .test config names answers 404"}
  - {repo: MathiasEskildsen/ONT-AmpSeq,                    tag: v1.1.2,  submodules: false, directory: .test, args: "--sdm conda --cores 2 --all-temp",                              tier: manual,  class: amplicon-taxa, note: "fix_tax_blast imports pandas, absent from its conda env (MathiasEskildsen/ONT-AmpSeq#20)"}
  - {repo: MPUSP/snakemake-ms-proteomics,                  tag: v1.1.1,  submodules: false, directory: .test, args: "--sdm conda --cores 2 -n",                                      tier: pr,      class: ms-runs, note: "upstream CI is dry-run only"}
