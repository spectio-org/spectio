# The synthetic Nextflow pipeline, scenario happy, on slurm-mini (docs/specs/dev-environment-and-testing.md §5).
# `python3 dev/scenario.py up happy-slurm-mini` creates its environment. The expect lines are checked by
# `CLUSTER=mini bash tests/slurm/e2e.sh launch nextflow` (P1 Task 22, pipelines-slurm.yml job e2e): each one
# names a check of tests/slurm/e2e_client.py, and a line that names none fails the run.
deployment: bundle                        # bundle | compose
scheduler: slurm-mini                     # local | slurm-mini | slurm-site | slurm-rest | k8s-mini | k8s-kueue
engine: nextflow 26.10
fixture: tests/pipelines/synthetic/nextflow
params: [scenario=happy, profile=test]    # tests/pipelines/synthetic/scenarios.yaml
gate: none                                # gate script: who decides what, when
expect:
  - run succeeded
  - head in tmux, no sbatch
  - counts equal the golden
  - head.exit 0, as the run reads it
  - no spool drop
  - no job or session left
