name: previews

# Static dev previews on Cloudflare Pages (docs/specs/dev-environment-and-testing.md §7.1).
# One branch alias per PR (pr-<n>), validated wave (wave-<id>, manual), release (v0-3-0) and main.
# Every deployment keeps its own hash URL; /versions lists them all. Without the secrets, it builds and skips the deploy.
# The CLOUDFARE_* names are the ones set on 2026-10-26 (typo); rename them to CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# and drop the fallbacks.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      alias:
        description: "Branch alias for this preview, e.g. wave-w2"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: spectio

jobs:
  preview:
    # PRs from forks cannot read the environment secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: previews
    steps:
      - name: Check the Cloudflare secrets (names only, never values)
        id: cf
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUND_ID }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$A" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; echo "Cloudflare secrets: both present";
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::Missing in environment 'previews' (or repository secrets):$missing"; fi

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Choose the branch alias
        id: alias
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          INPUT: ${{ inputs.alias }}
        run: |
          case "$EVENT" in
            pull_request)      a="pr-$PR" ;;
            workflow_dispatch) a="$INPUT" ;;
            *) if [[ "$GITHUB_REF" == refs/tags/* ]]; then a="${GITHUB_REF_NAME//./-}"; else a="main"; fi ;;
          esac
          a=$(echo "$a" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-')
          echo "alias=$a" >> "$GITHUB_OUTPUT"
          echo "Preview alias: $a"

      - name: Build the docs site
        env:
          SPECTIO_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SPECTIO_PREVIEW: ${{ steps.alias.outputs.alias }}
        run: uvx --with mkdocs-material mkdocs build --strict -d site

      - name: Skip notice (no Cloudflare secrets yet)
        if: steps.cf.outputs.has != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set in the 'previews' environment; the site was built but not deployed."

      - name: Generate /versions from the deployments API
        if: steps.cf.outputs.has == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUND_ID }}
        run: |
          python3 tools/previews/versions_page.py --project "$CF_PROJECT" --out site/versions/index.html \
            --current-alias "${{ steps.alias.outputs.alias }}" --current-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.has == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUND_ID }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message || 'manual preview' }}
        run: |
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main >/dev/null 2>&1 || true
          out=$(npx --yes wrangler@4 pages deploy site --project-name "$CF_PROJECT" \
                  --branch "${{ steps.alias.outputs.alias }}" \
                  --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" \
                  --commit-message "$(printf '%s' "$MSG" | head -1 | cut -c1-200)" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' <<<"$out" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias_url=https://${{ steps.alias.outputs.alias }}.$CF_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed preview
        if: steps.cf.outputs.has == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/" -o home.html && break; sleep 10; done
          grep -q "${SHA:0:7}" home.html || { echo "::error::the deployed home page does not show build ${SHA:0:7}"; exit 1; }
          curl -fsS "$URL/versions/" -o /dev/null
          curl -fsS "$URL/progress/" -o /dev/null
          echo "Preview OK: $URL"

      - name: Comment the links on the PR
        if: steps.cf.outputs.has == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          BRANCH: ${{ github.head_ref }}
        with:
          script: |
            const marker = '<!-- spectio-preview -->';
            const body = `${marker}
            **Preview of this PR** (kept, never overwritten): ${process.env.URL}
            Latest for this PR: ${process.env.ALIAS_URL} · all versions: ${process.env.ALIAS_URL}/versions/

            [![Open in GitHub Codespaces](https://github.com/codespaces/badge.svg)](https://codespaces.new/${context.repo.owner}/${context.repo.repo}/tree/${process.env.BRANCH}?quickstart=1)
            Full stack on demand: the codespace serves the docs on port 8000 (and Spectio on 8080 once it exists).`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
