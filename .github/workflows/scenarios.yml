name: scenarios · isolation (sind, kind)

# The isolated, parallel scenarios of docs/specs/dev-environment-and-testing.md §5 (dev/scenario.py): the unit tests
# of its pure parts, then tests/scenarios/parallel.sh, which brings up two slurm-mini scenarios (sind realms spx-1
# and spx-2), one k8s-mini scenario (kind cluster spx-3) and one local scenario at the same time, checks that they do
# not collide, takes them down and checks that nothing is left. Step page: docs/progress/W3/T5.md.
# Not called by ci.yml, so not part of ci-ok: like pipelines-slurm.yml it runs on any push that touches its paths.
on:
  push:                    # any branch, so autopilot branches are checked before their PR
    paths: ["dev/scenario.py", "dev/slurm/**", "dev/k8s/**", "dev/lib.sh", "dev/bootstrap.sh", "dev/versions.env", "tests/scenarios/**", ".github/workflows/scenarios.yml"]
  schedule:
    - cron: "53 4 * * *"   # nightly (§11)
  workflow_dispatch:

permissions: {}

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parallel:
    name: three scenarios in parallel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SIND_PROGRESS: plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests (ids, ports, paths, scenario files)
        run: python3 -m unittest discover -s tests/scenarios -p 'test_*.py' -v
      - name: Bootstrap (sind, kind, kubectl at the dev/versions.env pins)
        timeout-minutes: 10
        run: bash dev/bootstrap.sh
      - name: Up in parallel, check, down, nothing left
        run: bash tests/scenarios/parallel.sh
      - name: Clean up on failure
        if: failure()
        run: for id in 1 2 3 4; do python3 dev/scenario.py down "$id" || true; done
