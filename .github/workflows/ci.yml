name: ci

# The single required CI check, ci-ok (docs/specs/dev-environment-and-testing.md §11, R8b DEP-T-001, inbox #26).
# A change-detection job decides which pipeline workflows a PR needs; they are reusable workflows called here,
# so a PR that skips them still gets a ci-ok result. security.yml runs on every PR and push, with no path filter.
# Required checks: ci-ok here, docs-gate and pr-body in docs.yml. Never a job of a path-filtered workflow.
on:
  pull_request:
  push:
    branches: [main]   # not autopilot/integration: its promotion PR already runs this on every merge

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      synthetic: ${{ steps.paths.outputs.synthetic }}
      real: ${{ steps.paths.outputs.real }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 2, persist-credentials: false}
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # On a PR the checkout is the merge commit: its first parent is the base branch tip.
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            touched() { grep -qE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
            synthetic=$(touched '^(tests/pipelines/synthetic/|\.github/workflows/(pipelines-synthetic|ci)\.yml$)')
            real=$(touched '^(tests/pipelines/real/|\.github/workflows/(pipelines-real|ci)\.yml$)')
          else
            # Pushes to main: the synthetic scenarios always; the corpus runs nightly.
            synthetic=true; real=false
          fi
          echo "synthetic=$synthetic real=$real"
          { echo "synthetic=$synthetic"; echo "real=$real"; } >> "$GITHUB_OUTPUT"

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  unit:
    # Fast Python unit tests with no cluster: today the SLURM fixture guard (tests/slurm/test_fixture.py, SEC-T3-07).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests/slurm -p 'test_*.py'

  product:
    # The uv workspace under packages/ (architecture §6): lint, types, import contracts and unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32" # = UV_VERSION in dev/versions.env
          # = UV_SHA256 in dev/versions.env (the x86_64 linux tarball); setup-uv v6.8.0 knows no sum for this version.
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false
      - name: Install the workspace (uv.lock must be current)
        run: |
          . dev/versions.env
          uv sync --locked --python "$PYTHON_VERSION"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy packages
      - run: uv run --locked lint-imports
      - name: Import contracts in a fresh environment (SEC-P3T1-06)
        # Each package installed with only what it declares, at the versions and hashes of uv.lock:
        # importing every module must neither need nor load a forbidden package (lint-imports
        # sees only the static imports).
        run: |
          . dev/versions.env
          check='import importlib, importlib.util, pkgutil, sys
          root, *banned = sys.argv[1:]
          for info in pkgutil.walk_packages(importlib.import_module(root).__path__, root + "."):
              importlib.import_module(info.name)
          found = [b for b in banned if b in sys.modules or importlib.util.find_spec(b)]
          sys.exit(f"{root} pulls in {found}" if found else None)'
          tmp=$(mktemp -d)
          # fresh <package> <dirs>: a venv with the package's locked dependencies, then <dirs>.
          # --no-cache: uv would reuse a wheel built from older sources of the same version.
          fresh() {
            uv venv --quiet --python "$PYTHON_VERSION" "$tmp/$1"
            uv export --quiet --frozen --no-dev --no-emit-workspace --package "$1" -o "$tmp/$1.txt"
            uv pip install --no-cache --python "$tmp/$1/bin/python" --require-hashes -r "$tmp/$1.txt"
            uv pip install --no-cache --python "$tmp/$1/bin/python" --no-deps "${@:2}"
          }
          fresh spectio-sdk ./packages/spectio-sdk
          "$tmp/spectio-sdk/bin/python" -I -c "$check" spectio_sdk spectio spectio_server fastapi sqlalchemy
          fresh spectio ./packages/spectio-sdk ./packages/spectio
          "$tmp/spectio/bin/python" -I -c "$check" spectio spectio_server fastapi sqlalchemy
      - run: uv run --locked pytest

  pipelines-synthetic:
    needs: changes
    if: needs.changes.outputs.synthetic == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pipelines-synthetic.yml

  pipelines-real:
    needs: changes
    if: needs.changes.outputs.real == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pipelines-real.yml

  ci-ok:
    # Skipped jobs count as passing; only failure or cancelled fails (pattern: depictio depictio-ci.yaml:3144-3174).
    if: always()
    needs: [changes, security, unit, product, pipelines-synthetic, pipelines-real]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required CI job failed or was cancelled"; exit 1 ;;
          esac
