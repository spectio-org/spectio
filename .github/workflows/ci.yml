name: ci

# The single required CI check, ci-ok (docs/specs/dev-environment-and-testing.md §11, R8b DEP-T-001, inbox #26).
# A change-detection job decides which pipeline workflows a PR needs; they are reusable workflows called here,
# so a PR that skips them still gets a ci-ok result. security.yml runs on every PR and push, with no path filter.
# Required checks: ci-ok here, docs-gate and pr-body in docs.yml. Never a job of a path-filtered workflow.
on:
  pull_request:
  push:
    branches: [main]   # not autopilot/integration: its promotion PR already runs this on every merge

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      synthetic: ${{ steps.paths.outputs.synthetic }}
      real: ${{ steps.paths.outputs.real }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 2, persist-credentials: false}
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # On a PR the checkout is the merge commit: its first parent is the base branch tip.
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            touched() { grep -qE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
            synthetic=$(touched '^(tests/pipelines/synthetic/|engine-bridges/nf-spectio/|packages/spectio/tests/test_bridge_nextflow\.py$|\.github/workflows/(pipelines-synthetic|ci)\.yml$)')
            real=$(touched '^(tests/pipelines/real/|\.github/workflows/(pipelines-real|ci)\.yml$)')
          else
            # Pushes to main: the synthetic scenarios always; the corpus runs nightly.
            synthetic=true; real=false
          fi
          echo "synthetic=$synthetic real=$real"
          { echo "synthetic=$synthetic"; echo "real=$real"; } >> "$GITHUB_OUTPUT"

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  unit:
    # Fast Python unit tests with no cluster: today the SLURM fixture guard (tests/slurm/test_fixture.py, SEC-T3-07).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests/slurm -p 'test_*.py'

  product:
    # The uv workspace under packages/ (architecture §6): lint, types, import contracts and unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32" # = UV_VERSION in dev/versions.env
          # = UV_SHA256 in dev/versions.env (the x86_64 linux tarball); setup-uv v6.8.0 knows no sum for this version.
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
          enable-cache: false
      - name: Install the workspace (uv.lock must be current)
        run: |
          . dev/versions.env
          uv sync --locked --python "$PYTHON_VERSION"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy packages
      - run: uv run --locked lint-imports
      - name: Import contracts in a fresh environment (SEC-P3T1-06)
        # Each package installed with only what it declares, at the versions and hashes of uv.lock:
        # importing every module must neither need nor load a forbidden package (lint-imports
        # sees only the static imports).
        run: |
          . dev/versions.env
          check='import importlib, importlib.util, pkgutil, sys
          root, *banned = sys.argv[1:]
          for info in pkgutil.walk_packages(importlib.import_module(root).__path__, root + "."):
              importlib.import_module(info.name)
          found = [b for b in banned if b in sys.modules or importlib.util.find_spec(b)]
          sys.exit(f"{root} pulls in {found}" if found else None)'
          tmp=$(mktemp -d)
          # fresh <package> <dirs>: a venv with the package's locked dependencies, then <dirs>.
          # --no-cache: uv would reuse a wheel built from older sources of the same version.
          fresh() {
            uv venv --quiet --python "$PYTHON_VERSION" "$tmp/$1"
            uv export --quiet --frozen --no-dev --no-emit-workspace --package "$1" -o "$tmp/$1.txt"
            uv pip install --no-cache --python "$tmp/$1/bin/python" --require-hashes -r "$tmp/$1.txt"
            uv pip install --no-cache --python "$tmp/$1/bin/python" --no-deps "${@:2}"
          }
          fresh spectio-sdk ./packages/spectio-sdk
          "$tmp/spectio-sdk/bin/python" -I -c "$check" spectio_sdk spectio spectio_server fastapi sqlalchemy
          fresh spectio ./packages/spectio-sdk ./packages/spectio
          "$tmp/spectio/bin/python" -I -c "$check" spectio spectio_server fastapi sqlalchemy
      - run: uv run --locked pytest

  web:
    # The screens under web/ (P1 Task 19): Vitest, then the Vite build, on the Node of dev/versions.env.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Read the Node pin (dev/versions.env, §1)
        id: pins
        run: grep '^NODE_VERSION=' ../dev/versions.env | sed 's/^NODE_VERSION=/node=/' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "${{ steps.pins.outputs.node }}"}
      # npm ci checks each package's integrity hash against package-lock.json; no install script runs.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test
      - run: npm run build

  e2e-local:
    # The Playwright smoke of P1 Task 20 (tests/e2e/skeleton.spec.ts) against a real `spectio serve` in local
    # mode (tests/e2e/serve-local.sh), with Nextflow for the tests that launch, cancel and follow a run.
    # Not in ci-ok's needs until it has proven reliable on CI (inbox #90): a red run here does not block a PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Read the pins (dev/versions.env, §1)
        id: pins
        run: |
          . dev/versions.env
          { echo "node=$NODE_VERSION"; echo "nextflow=$NEXTFLOW_VERSION"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "${{ steps.pins.outputs.node }}"}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32" # = UV_VERSION in dev/versions.env
          checksum: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967 # = UV_SHA256
          enable-cache: false
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ steps.pins.outputs.nextflow }}
      - name: Install the workspace, the screens and Playwright's Chromium
        # npm ci checks each package's integrity hash; no install script runs. The Chromium download is not
        # hashed by us (§1), as in e2e.yml.
        run: |
          . dev/versions.env
          uv sync --locked --python "$PYTHON_VERSION"
          npm --prefix web ci --no-audit --no-fund --ignore-scripts
          npm --prefix web run build
          npm --prefix tests/e2e ci --no-audit --no-fund --ignore-scripts
          (cd tests/e2e && npx --no-install playwright install --with-deps chromium)
      - name: Start Spectio (local mode)
        # The head runs the engine through the login shell (bash -l), whose PATH lacks setup-nextflow's
        # directory: name the binary, as the local exit check does.
        run: |
          SPECTIO_ENGINES_NEXTFLOW_CMD=$(command -v nextflow)
          export SPECTIO_ENGINES_NEXTFLOW_CMD
          bash tests/e2e/serve-local.sh --port 8765 --seed-stages > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 300); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/api/v1/version && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"; exit 1
      - name: Smoke, desktop and phone
        working-directory: tests/e2e
        env:
          CI: "true"
          SPECTIO_E2E_BASE_URL: http://127.0.0.1:8765
          SPECTIO_E2E_ENGINES: "1"
          SPECTIO_E2E_SEEDED: "1"
        run: npx --no-install playwright test skeleton.spec.ts --project desktop --project phone
      - name: Keep the report and the server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-local-report
          path: |
            tests/e2e/playwright-report/
            ${{ runner.temp }}/serve.log
          retention-days: 14

  pipelines-synthetic:
    needs: changes
    if: needs.changes.outputs.synthetic == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pipelines-synthetic.yml

  pipelines-real:
    needs: changes
    if: needs.changes.outputs.real == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pipelines-real.yml

  ci-ok:
    # Skipped jobs count as passing; only failure or cancelled fails (pattern: depictio depictio-ci.yaml:3144-3174).
    if: always()
    needs: [changes, security, unit, product, web, pipelines-synthetic, pipelines-real]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required CI job failed or was cancelled"; exit 1 ;;
          esac
