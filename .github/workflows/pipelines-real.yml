name: pipelines · nf-core and Snakemake catalog

# Real pipelines with their own test datasets (tests/pipelines/real/corpus.yaml).
# PR tier: called by ci.yml on pull requests that touch the corpus; everything nightly. Private-repo runners have
# 2 CPU, so nf-core runs get a resourceLimits override (run_corpus.py --limits private).
# Each job first frees runner disk (the test profiles pull several GB of containers or conda packages) and samples
# free memory and disk every 5 s; the job summary and the resources.json artifact give the start and minimum values
# (results: docs/research/corpus-ci-2026-10-27.md).
on:
  workflow_call:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      tier: {description: "pr | nightly | manual", default: "pr"}

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nfcore: ${{ steps.m.outputs.nfcore }}
      smk: ${{ steps.m.outputs.smk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - id: m
        env:
          TIER: ${{ github.event_name == 'schedule' && 'nightly' || (inputs.tier || 'pr') }}
        run: |
          python3 - "$TIER" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys, yaml
          tier = sys.argv[1]
          c = yaml.safe_load(open("tests/pipelines/real/corpus.yaml"))
          want = {"pr": {"pr"}, "nightly": {"pr", "nightly"}, "manual": {"pr", "nightly", "manual"}}[tier]
          nf = [e for e in c["nfcore"] if e["tier"] in want]
          smk = [dict(e, name=e["repo"].split("/")[1]) for e in c["snakemake_catalog"] if e["tier"] in want]
          print("nfcore=" + json.dumps(nf))
          print("smk=" + json.dumps(smk))
          PY

  nfcore:
    needs: matrix
    name: nf-core/${{ matrix.p.name }} ${{ matrix.p.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        p: ${{ fromJSON(needs.matrix.outputs.nfcore) }}
    env:
      NAME: ${{ matrix.p.name }}
    steps:
      - name: Free runner disk
        run: |
          df -h /
          # Toolchains these jobs never use, and the preloaded Docker images.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/julia* /opt/az /opt/microsoft
          docker image prune -af > /dev/null
          df -h /
      - name: Sample free memory and disk every 5 s
        run: |
          grep -E 'MemTotal|MemAvailable|SwapTotal' /proc/meminfo; nproc
          (while :; do
             echo "$(date +%s) $(awk '/^MemAvailable/ {print $2}' /proc/meminfo) $(df -k --output=avail / | tail -1)"
             sleep 5
           done) > "$RUNNER_TEMP/samples.txt" 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with: {version: "26.10.3"}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Run test profile
        env:
          LIMITS: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          uv run --with pyyaml python tests/pipelines/real/run_corpus.py --engine nextflow \
            --name "$NAME" --workdir "$RUNNER_TEMP/corpus" --limits "$LIMITS"
      - if: failure()
        name: Tail of the run log
        run: tail -n 80 "$RUNNER_TEMP/corpus/$NAME/run.log"
      - if: always()
        name: Memory and disk summary
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          total=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)
          awk -v total="$total" -v name="$NAME" 'NR == 1 {a0 = $2; d0 = $3; amin = $2; dmin = $3; t0 = $1}
            {if ($2 < amin) amin = $2; if ($3 < dmin) dmin = $3; t1 = $1}
            END {g = 1048576; printf "{\"name\": \"%s\", \"mem_total_gb\": %.2f, \"mem_avail_start_gb\": %.2f, \"mem_avail_min_gb\": %.2f, \"run_peak_gb\": %.2f, \"disk_free_start_gb\": %.1f, \"disk_free_min_gb\": %.1f, \"sampled_s\": %d}\n",
                 name, total / g, a0 / g, amin / g, (a0 - amin) / g, d0 / g, dmin / g, t1 - t0}' \
            "$RUNNER_TEMP/samples.txt" > "$RUNNER_TEMP/res/resources.json"
          # Nextflow's local executor caps tasks at the memory it reads from the OS (LocalPollingMonitor).
          grep -h -m1 'local task monitor' "$RUNNER_TEMP"/corpus/*/.nextflow.log >> "$RUNNER_TEMP/res/resources.txt" 2>/dev/null || true
          { echo '```'; cat "$RUNNER_TEMP/res/resources.json" "$RUNNER_TEMP/res/resources.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/res/resources.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nfcore-${{ matrix.p.name }}
          path: |
            ${{ runner.temp }}/res/**
            ${{ runner.temp }}/corpus/${{ matrix.p.name }}/result.json
            ${{ runner.temp }}/corpus/${{ matrix.p.name }}/run.log
            ${{ runner.temp }}/corpus/${{ matrix.p.name }}/results/pipeline_info/**
            ${{ runner.temp }}/corpus/${{ matrix.p.name }}/results/multiqc/**

  snakemake:
    needs: matrix
    name: ${{ matrix.w.repo }} ${{ matrix.w.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.matrix.outputs.smk) }}
    env:
      NAME: ${{ matrix.w.name }}
    steps:
      - name: Free runner disk
        run: |
          df -h /
          # Toolchains these jobs never use, and the preloaded Docker images.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/julia* /opt/az /opt/microsoft
          docker image prune -af > /dev/null
          df -h /
      - name: Sample free memory and disk every 5 s
        run: |
          grep -E 'MemTotal|MemAvailable|SwapTotal' /proc/meminfo; nproc
          (while :; do
             echo "$(date +%s) $(awk '/^MemAvailable/ {print $2}' /proc/meminfo) $(df -k --output=avail / | tail -1)"
             sleep 5
           done) > "$RUNNER_TEMP/samples.txt" 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.w.repo }}
          ref: ${{ matrix.w.tag }}
          submodules: ${{ matrix.w.submodules }}
          persist-credentials: false
      - name: Run .test with the workflow's own test data
        uses: snakemake/snakemake-github-action@6fe563b0130fe20e371f61262320e21224e78a58 # v2.1.2
        with:
          directory: ${{ matrix.w.directory }}
          snakefile: ${{ matrix.w.snakefile || 'workflow/Snakefile' }}
          snakemake-version: "9.27.1"
          args: "${{ matrix.w.args }} --conda-cleanup-pkgs cache --show-failed-logs"
      - if: always()
        name: Memory and disk summary
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          total=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)
          awk -v total="$total" -v name="$NAME" 'NR == 1 {a0 = $2; d0 = $3; amin = $2; dmin = $3; t0 = $1}
            {if ($2 < amin) amin = $2; if ($3 < dmin) dmin = $3; t1 = $1}
            END {g = 1048576; printf "{\"name\": \"%s\", \"mem_total_gb\": %.2f, \"mem_avail_start_gb\": %.2f, \"mem_avail_min_gb\": %.2f, \"run_peak_gb\": %.2f, \"disk_free_start_gb\": %.1f, \"disk_free_min_gb\": %.1f, \"sampled_s\": %d}\n",
                 name, total / g, a0 / g, amin / g, (a0 - amin) / g, d0 / g, dmin / g, t1 - t0}' \
            "$RUNNER_TEMP/samples.txt" > "$RUNNER_TEMP/res/resources.json"
          { echo '```'; cat "$RUNNER_TEMP/res/resources.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/res/resources.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smk-${{ matrix.w.name }}
          path: ${{ runner.temp }}/res/**
