name: pipelines · synthetic scenarios

# Runs the generated scenario pipelines (tests/pipelines/synthetic) on every engine version we support.
# Fast (< 10 min): called by ci.yml on PRs that touch tests/pipelines/synthetic/** and on pushes to main and
# autopilot/integration. The stress scenario (12 000 tasks) runs nightly.
on:
  workflow_call:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: nextflow, version: "26.10.4"}   # = NEXTFLOW_VERSION in dev/versions.env
          - {engine: nextflow, version: "25.10.9"}
          - {engine: snakemake, version: "9.27.1"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Set up Nextflow
        if: matrix.engine == 'nextflow'
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: ${{ matrix.version }}
      - name: Set up Snakemake
        if: matrix.engine == 'snakemake'
        env:
          VERSION: ${{ matrix.version }}
        run: uv tool install "snakemake==$VERSION" --with "snakemake-executor-plugin-slurm==2.8.0"
      - name: Unit tests (golden fixtures)
        run: uv run --with pyyaml==6.0.3 python -m unittest tests/pipelines/synthetic/test_golden.py
      - name: nf-spectio writes the spool (P1 Task 6)
        # Builds the plugin against this Nextflow and runs it on the synthetic pipeline (local executor).
        # The pinned Python (dev/versions.env): the runner's system SQLite fails check_sqlite_version.
        if: matrix.engine == 'nextflow'
        run: |
          . dev/versions.env
          uv run --locked --python "$PYTHON_VERSION" pytest packages/spectio/tests/test_bridge_nextflow.py -v -m engines
      - name: Run scenarios
        # --golden check: task outcomes must match golden/<engine>-<version>/. A missing directory, an unreadable
        # engine version or a missing fixture for a PR scenario fails the job; only nightly scenarios may have none.
        env:
          ENGINE: ${{ matrix.engine }}
          NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          uv run --with pyyaml==6.0.3 python tests/pipelines/synthetic/run_scenarios.py \
            --engine "$ENGINE" --workdir "$RUNNER_TEMP/scenarios" --golden check \
            ${NIGHTLY:+--nightly}
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-${{ matrix.engine }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/scenarios/**/report.json
            ${{ runner.temp }}/scenarios/**/run*.log
            ${{ runner.temp }}/scenarios/**/golden.actual.tsv
            ${{ runner.temp }}/scenarios/**/results/pipeline_info/**
