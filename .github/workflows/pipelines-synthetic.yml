name: pipelines · synthetic scenarios

# Runs the generated scenario pipelines (tests/pipelines/synthetic) on every engine version we support.
# Fast (< 10 min): every PR. The stress scenario (12 000 tasks) runs nightly.
on:
  pull_request:
    paths: ["tests/pipelines/synthetic/**", ".github/workflows/pipelines-synthetic.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: nextflow, version: "26.10.3"}
          - {engine: nextflow, version: "25.10.9"}
          - {engine: snakemake, version: "9.27.1"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Nextflow
        if: matrix.engine == 'nextflow'
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.version }}
      - name: Set up Snakemake
        if: matrix.engine == 'snakemake'
        run: uv tool install "snakemake==${{ matrix.version }}" --with "snakemake-executor-plugin-slurm==2.8.0"
      - name: Run scenarios
        run: |
          uv run --with pyyaml python tests/pipelines/synthetic/run_scenarios.py \
            --engine ${{ matrix.engine }} --workdir "$RUNNER_TEMP/scenarios" \
            ${{ github.event_name == 'schedule' && '--nightly' || '' }}
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.engine }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/scenarios/**/report.json
            ${{ runner.temp }}/scenarios/**/run*.log
            ${{ runner.temp }}/scenarios/**/results/pipeline_info/**
