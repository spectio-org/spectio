name: staging · deploy, verify, share

# Deploys the Compose stack to the staging VM over the tailnet, verifies it through the public
# Tailscale Funnel URL, and posts a scoped magic link (share link) on the PR for reviewers.
# Disabled until the staging VM exists: set repository variable STAGING_ENABLED=true.
# Secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET (Tailscale OAuth client owning tag:ci),
#          STAGING_ADMIN_TOKEN (service account on the staging instance, scope share-links:create).
# Variables: STAGING_HOST (tailnet name, e.g. spectio-staging), STAGING_PUBLIC_URL (Funnel URL).
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: staging-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    env:
      SLOT: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=edge,branch=main
            type=ref,event=pr
      - name: Build image (placeholder until the server exists)
        run: echo "build and push ${{ steps.meta.outputs.tags }}"
      - name: Join the tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.STAGING_HOST }}
      - name: Deploy slot over Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new "deploy@${{ vars.STAGING_HOST }}" \
            "cd /srv/spectio && SLOT=$SLOT IMAGE_TAG=sha-${GITHUB_SHA::7} ./deploy-slot.sh"
      - name: Verify through the public URL
        run: |
          BASE="${{ vars.STAGING_PUBLIC_URL }}/$([ "$SLOT" = main ] && echo spectio || echo "$SLOT")"
          curl -fsS "$BASE/health/ready"
          curl -fsS "$BASE/api/v1/version" | tee version.json
          jq -e --arg sha "${GITHUB_SHA::7}" '.git_sha | startswith($sha)' version.json
      # - Playwright smoke against $BASE (tests/e2e smoke project) — added in T6
      - name: Create a scoped share link for reviewers (PR previews)
        if: github.event_name == 'pull_request'
        id: link
        run: |
          BASE="${{ vars.STAGING_PUBLIC_URL }}/$SLOT"
          URL=$(curl -fsS -X POST "$BASE/api/v1/share-links" \
            -H "Authorization: Bearer ${{ secrets.STAGING_ADMIN_TOKEN }}" -H "Content-Type: application/json" \
            -d '{"resource":"project","id":"demo","role":"reviewer","expires_in":"72h","max_uses":20}' | jq -r .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `**Preview deployed** for ${context.sha.slice(0,7)}\n\n` +
              `- Open (reviewer access, 72 h, 20 uses): ${{ steps.link.outputs.url }}\n` +
              `- Version: see /api/v1/version on the preview\n`;
            github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

  teardown:
    if: vars.STAGING_ENABLED == 'true' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: ssh "deploy@${{ vars.STAGING_HOST }}" "cd /srv/spectio && SLOT=pr-${{ github.event.pull_request.number }} ./deploy-slot.sh --down"
