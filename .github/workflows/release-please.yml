name: release

# Conventional Commits on main -> one release PR with version bumps and a concise CHANGELOG per version.
# Merging that PR tags vX.Y.Z, publishes GitHub release notes, and triggers image/chart/PyPI builds.
# It runs with a GitHub App installation token, never GITHUB_TOKEN (R8b DEP-T-002, dev-environment §12): the
# variable RELEASE_APP_ID and the secret RELEASE_APP_PRIVATE_KEY, both in the `release` environment (inbox #8).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Off until Thomas sets the repository variable RELEASE_PLEASE_ENABLED=true (inbox #8, #26).
    if: vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - name: Check the App credentials (names only, never values)
        id: app
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY is missing in the 'release' environment; release-please skipped."; fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.app.outputs.ok == 'true'
        id: token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.app.outputs.ok == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
