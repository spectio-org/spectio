name: docs

# The docs gate (docs/specs/documentation-system.md §3.3, §7.3). Required checks: docs-gate, pr-body.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - name: Python tools for the figure scripts, and ffmpeg for video checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --break-system-packages pyyaml playwright
          python3 -m playwright install --with-deps chromium
      - name: Unit tests of the docs gate
        run: python3 -m unittest tools/docs/test_check.py
      - name: Strict build, Mermaid, diagram freshness, media manifest and budget, Progress pages
        # fetch-depth 0 already fetched every branch, so origin/<base> exists without a credentialed fetch.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then python3 tools/docs/check.py --base "origin/$BASE_REF"; else python3 tools/docs/check.py; fi
      - name: Screenshot churn guard
        if: github.event_name == 'pull_request'
        env:
          SPECTIO_ALLOW_SCREENSHOT_UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'screenshots') && '1' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/media/check_churn.sh "origin/$BASE_REF"
      - name: Build the site for the artifact
        run: uvx --with mkdocs-material mkdocs build --strict -d site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: site, path: site/}

  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0, persist-credentials: false}
      - name: PR title, required sections, figure for mechanism changes
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --break-system-packages pyyaml
          printf '%s' "$BODY" > /tmp/body.md
          git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed.txt
          python3 tools/docs/check.py --only pr-body --pr-title "$TITLE" --pr-body /tmp/body.md --changed /tmp/changed.txt --labels "$LABELS"
