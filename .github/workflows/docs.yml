name: docs

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the site (strict: warnings, including broken links, fail the build)
        run: uvx --with mkdocs-material mkdocs build --strict
      - name: Check Mermaid diagrams render
        run: |
          npm install --no-save @mermaid-js/mermaid-cli@11
          python3 - <<'EOF'
          import pathlib, re, subprocess, sys, tempfile
          bad = 0
          for md in pathlib.Path("docs").rglob("*.md"):
              for i, block in enumerate(re.findall(r"```mermaid\n(.*?)```", md.read_text(), re.S)):
                  with tempfile.TemporaryDirectory() as d:
                      src = pathlib.Path(d, "d.mmd"); src.write_text(block)
                      r = subprocess.run(["npx", "mmdc", "-q", "-i", str(src), "-o", str(pathlib.Path(d, "d.svg"))], capture_output=True, text=True)
                      if r.returncode:
                          bad += 1; print(f"::error file={md}::mermaid block {i} failed\n{r.stderr[-500:]}")
          sys.exit(1 if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
