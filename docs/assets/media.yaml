# Every generated figure, screenshot, cast and video in the docs, with the command that regenerates it.
# Checked by `python3 tools/docs/check.py --only media` (docs/specs/documentation-system.md §3.3).
media:
  - id: autopilot-loop
    kind: diagram
    generator: python3 tools/diagrams/autopilot_loop.py
    outputs:
      - docs/assets/diagrams/autopilot-loop_light.svg
      - docs/assets/diagrams/autopilot-loop_dark.svg
      - docs/assets/diagrams/autopilot-loop_light.png
      - docs/assets/diagrams/autopilot-loop_dark.png
