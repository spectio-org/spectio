    generator: python3 tools/media/shots.py run --shot app-run-detail-phone --theme light
    outputs: [docs/assets/shots/app-run-detail-phone_light.webp]
  - id: app-run-detail-failed
    kind: screenshot
    # live, as app-run-detail; SPECTIO_DEMO_FAILED_RUN is a run launched with fail_mode=exit fail_process=MERGE
    generator: python3 tools/media/shots.py run --shot app-run-detail-failed --theme both
    outputs: [docs/assets/shots/app-run-detail-failed_light.webp, docs/assets/shots/app-run-detail-failed_dark.webp]
  - id: app-run-process
    kind: screenshot
    # live, as app-run-detail: the sheet of process ALIGN, opened from its name (P3 UI parity D)
    generator: python3 tools/media/shots.py run --shot app-run-process --theme both
    outputs: [docs/assets/shots/app-run-process_light.webp, docs/assets/shots/app-run-process_dark.webp]
  - id: app-run-logs
    kind: screenshot
    # live, as app-run-detail-failed: its Logs tab on the head's output (?tab=logs&source=head-out),
    # searched for MERGE (four matches, P3 UI parity D)
    generator: python3 tools/media/shots.py run --shot app-run-logs --theme both
    outputs: [docs/assets/shots/app-run-logs_light.webp, docs/assets/shots/app-run-logs_dark.webp]
