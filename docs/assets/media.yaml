      - docs/assets/diagrams/t1-golden-fixtures_dark.svg
      - docs/assets/diagrams/t1-golden-fixtures_light.png
      - docs/assets/diagrams/t1-golden-fixtures_dark.png
  - id: dev-toolchain
    kind: diagram
    # PNGs need the local Virgil font (SPECTIO_VIRGIL_TTF), not committed (inbox #1)
    generator: python3 tools/diagrams/dev_toolchain.py
    outputs:
      - docs/assets/diagrams/dev_toolchain_light.svg
      - docs/assets/diagrams/dev_toolchain_dark.svg
      - docs/assets/diagrams/dev_toolchain_light.png
      - docs/assets/diagrams/dev_toolchain_dark.png
  - id: dev-doctor
    kind: cast
    # runs the real scripts; needs the toolchain installed (bash dev/bootstrap.sh --ci)
    generator: python3 tools/media/cast.py tools/media/casts/dev-doctor.yaml
    outputs: [docs/assets/casts/dev-doctor.cast]
