      - docs/assets/diagrams/apply2_specs_dark.svg
      - docs/assets/diagrams/apply2_specs_light.png
      - docs/assets/diagrams/apply2_specs_dark.png
  - id: apply2-relaunch
    kind: diagram
    generator: python3 tools/diagrams/apply2_relaunch.py
    outputs:
      - docs/assets/diagrams/apply2_relaunch_light.svg
      - docs/assets/diagrams/apply2_relaunch_dark.svg
      - docs/assets/diagrams/apply2_relaunch_light.png
      - docs/assets/diagrams/apply2_relaunch_dark.png
  - id: d4-pr-checks
    kind: diagram
    generator: python3 tools/diagrams/d4_pr_checks.py
    outputs:
      - docs/assets/diagrams/d4_pr_checks_light.svg
      - docs/assets/diagrams/d4_pr_checks_dark.svg
      - docs/assets/diagrams/d4_pr_checks_light.png
      - docs/assets/diagrams/d4_pr_checks_dark.png
  - id: security-checks
    kind: cast
    # runs tools/ci/security.sh secrets, deps and workflows for real on the repository (zizmor offline)
    generator: python3 tools/media/cast.py tools/media/casts/security-checks.yaml
    outputs: [docs/assets/casts/security-checks.cast]
  - id: d1-claude-config
    kind: diagram
    generator: python3 tools/diagrams/d1_claude_config.py
    outputs:
      - docs/assets/diagrams/d1_claude_config_light.svg
      - docs/assets/diagrams/d1_claude_config_dark.svg
      - docs/assets/diagrams/d1_claude_config_light.png
      - docs/assets/diagrams/d1_claude_config_dark.png
  - id: claude-config
    kind: cast
    generator: python3 tools/media/cast.py tools/media/casts/claude-config.yaml
    outputs: [docs/assets/casts/claude-config.cast]
  - id: d5-previews
    kind: diagram
    generator: python3 tools/diagrams/d5_previews.py
    outputs:
      - docs/assets/diagrams/d5-previews_light.svg
      - docs/assets/diagrams/d5-previews_dark.svg
      - docs/assets/diagrams/d5-previews_light.png
      - docs/assets/diagrams/d5-previews_dark.png
  - id: t7-corpus-ci
    kind: diagram
    generator: python3 tools/diagrams/t7_corpus_ci.py
    outputs:
