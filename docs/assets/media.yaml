# Every generated figure, screenshot, cast and video in the docs, with the command that regenerates it.
# Checked by `python3 tools/docs/check.py --only media` (docs/specs/documentation-system.md §3.3).
media:
  - id: autopilot-loop
    kind: diagram
    generator: python3 tools/diagrams/autopilot_loop.py
    outputs:
      - docs/assets/diagrams/autopilot-loop_light.svg
      - docs/assets/diagrams/autopilot-loop_dark.svg
      - docs/assets/diagrams/autopilot-loop_light.png
      - docs/assets/diagrams/autopilot-loop_dark.png
  - id: gate-resume
    kind: diagram
    generator: python3 tools/diagrams/gate_resume.py
    outputs:
      - docs/assets/diagrams/gate-resume_light.svg
      - docs/assets/diagrams/gate-resume_dark.svg
      - docs/assets/diagrams/gate-resume_light.png
      - docs/assets/diagrams/gate-resume_dark.png
  - id: cloud-env-sketch
    kind: diagram
    generator: python3 tools/diagrams/cloud_env.py
    outputs:
      - docs/assets/diagrams/cloud-env_light.svg
      - docs/assets/diagrams/cloud-env_dark.svg
      - docs/assets/diagrams/cloud-env_light.png
      - docs/assets/diagrams/cloud-env_dark.png
  - id: mvp001-cluster-sketch
    kind: diagram
    generator: python3 tools/diagrams/mvp001_cluster.py
    outputs:
      - docs/assets/diagrams/mvp001_cluster_light.svg
      - docs/assets/diagrams/mvp001_cluster_dark.svg
      - docs/assets/diagrams/mvp001_cluster_light.png
      - docs/assets/diagrams/mvp001_cluster_dark.png
  - id: synthetic-gate
    kind: cast
    generator: python3 tools/media/cast.py tools/media/casts/synthetic-gate.yaml
    outputs: [docs/assets/casts/synthetic-gate.cast]
  - id: ui-shots
    kind: screenshots
    generator: python3 tools/media/shots.py run --all --theme light
    outputs:
      - docs/assets/shots/run-detail_light.webp
      - docs/assets/shots/review-gate_light.webp
      - docs/assets/shots/review-gate-phone_light.webp
      - docs/assets/shots/overview_light.webp
      - docs/assets/shots/launch_light.webp
      - docs/assets/shots/runs_light.webp
      - docs/assets/shots/review-queue_light.webp
      - docs/assets/shots/environments_light.webp
      - docs/assets/shots/admin-plugins_light.webp
  - id: budget-loop
    kind: cast
    generator: python3 tools/media/cast.py tools/media/casts/budget-loop.yaml
    outputs: [docs/assets/casts/budget-loop.cast]
  - id: corpus-list
    kind: cast
    generator: python3 tools/media/cast.py tools/media/casts/corpus-list.yaml
    outputs: [docs/assets/casts/corpus-list.cast]
  - id: cloud-env
    kind: cast
    # replays the output recorded in spikes/cloud-env/LOG.md through stub tools; no real tool is run
    generator: python3 tools/media/cast.py tools/media/casts/cloud-env.yaml
    outputs: [docs/assets/casts/cloud-env.cast]
  - id: gate-review
    kind: combo
    # also writes tools/media/out/gate-review.gif (PR bodies only, not committed)
    generator: (cd tools/media && npm ci) && python3 tools/media/combo.py tools/media/combos/gate-review.yaml
    outputs:
      - docs/assets/media/gate-review.mp4
  - id: tool-logos
    kind: logos
    generator: "copied from the projects' official assets (Nextflow, nf-core, Snakemake, depictio); nominative use, see the landing page notice"
    outputs:
      - docs/assets/logos/logo-nextflow.png
      - docs/assets/logos/logo-nf-core.png
      - docs/assets/logos/logo-snakemake.png
      - docs/assets/logos/logo-depictio.png
  - id: r3-journeys-map
    kind: diagram
    generator: python3 tools/diagrams/r3_journeys_map.py
    outputs:
      - docs/assets/diagrams/r3_journeys_map_light.svg
      - docs/assets/diagrams/r3_journeys_map_dark.svg
      - docs/assets/diagrams/r3_journeys_map_light.png
      - docs/assets/diagrams/r3_journeys_map_dark.png
  - id: r6-contract-map
    kind: diagram
    generator: python3 tools/diagrams/r6_contract_map.py
    outputs:
      - docs/assets/diagrams/r6_contract_map_light.svg
      - docs/assets/diagrams/r6_contract_map_dark.svg
      - docs/assets/diagrams/r6_contract_map_light.png
      - docs/assets/diagrams/r6_contract_map_dark.png
  - id: triage2-sort
    kind: diagram
    generator: python3 tools/diagrams/triage2_sort.py
    outputs:
      - docs/assets/diagrams/triage2_sort_light.svg
      - docs/assets/diagrams/triage2_sort_dark.svg
      - docs/assets/diagrams/triage2_sort_light.png
      - docs/assets/diagrams/triage2_sort_dark.png
  - id: apply2-specs
    kind: diagram
    generator: python3 tools/diagrams/apply2_specs.py
    outputs:
