    kind: cast
    generator: python3 tools/media/cast.py tools/media/casts/synthetic-gate.yaml
    outputs: [docs/assets/casts/synthetic-gate.cast]
  - id: ui-shots
    kind: screenshots
    generator: python3 tools/media/shots.py run --all --theme light
    outputs:
      - docs/assets/shots/run-detail_light.webp
      - docs/assets/shots/review-gate_light.webp
      - docs/assets/shots/review-gate-phone_light.webp
      - docs/assets/shots/overview_light.webp
      - docs/assets/shots/launch_light.webp
      - docs/assets/shots/runs_light.webp
      - docs/assets/shots/review-queue_light.webp
      - docs/assets/shots/environments_light.webp
      - docs/assets/shots/admin-plugins_light.webp
      - docs/assets/shots/lite-run-detail_light.webp
      - docs/assets/shots/lite-launch_light.webp
      - docs/assets/shots/lite-runs_light.webp
      - docs/assets/shots/lite-run-detail-phone_light.webp
  - id: app-launch
    kind: screenshot
    # live: needs a running `spectio serve` (SPECTIO_URL) and the synthetic Nextflow pipeline
    # copied to a path free of forbidden terms (SPECTIO_DEMO_PIPELINE), tools/media/README.md;
    # since UI parity D it is picked from Try a test pipeline, so the server must have run it once
    generator: python3 tools/media/shots.py run --shot app-launch --theme both
    outputs: [docs/assets/shots/app-launch_light.webp, docs/assets/shots/app-launch_dark.webp]
  - id: app-launch-phone
    kind: screenshot
    # live, as app-launch, at 390 x 844
    generator: python3 tools/media/shots.py run --shot app-launch-phone --theme both
    outputs: [docs/assets/shots/app-launch-phone_light.webp, docs/assets/shots/app-launch-phone_dark.webp]
  - id: app-home
    kind: screenshot
    # live, as app-launch, after a finished run of the synthetic pipeline (profile test)
    generator: python3 tools/media/shots.py run --shot app-home --theme light
    outputs: [docs/assets/shots/app-home_light.webp]
  - id: app-runs
    kind: screenshot
    # live, as app-home
    generator: python3 tools/media/shots.py run --shot app-runs --theme light
    outputs: [docs/assets/shots/app-runs_light.webp]
  - id: app-home-phone
    kind: screenshot
