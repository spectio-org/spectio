[project]
name = "spectio-server"
version = "0.0.1"
description = "Spectio's server: API, store and projector"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "spectio",
    "spectio-sdk",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[tool.uv.sources]
spectio = { workspace = true }
spectio-sdk = { workspace = true }

[build-system]
requires = ["uv_build==0.11.32"]  # = UV_VERSION in dev/versions.env
build-backend = "uv_build"
