[project]
name = "spectio-server"
version = "0.0.1"
description = "Spectio's server: API, store and projector"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.2,<7",
    "spectio",
    "spectio-sdk",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[tool.uv.sources]
spectio = { workspace = true }
spectio-sdk = { workspace = true }

[build-system]
# hatchling, for the build hook that adds the built screens (spectio_server/web): P1 Task 21, architecture §7.3.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectio_server"]

# Only these in the sdist (hatchling adds pyproject.toml and PKG-INFO), never an untracked local file.
[tool.hatch.build.targets.sdist]
only-include = ["src", "hatch_build.py"]

[tool.hatch.build.hooks.custom]  # hatch_build.py
