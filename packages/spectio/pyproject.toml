[project]
name = "spectio"
version = "0.0.1"
description = "Spectio's CLI and runner (no FastAPI, no SQLAlchemy: architecture §6)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "spectio-sdk",
    "typer>=0.15,<1",
]

[project.scripts]
spectio = "spectio.cli.main:app"

[tool.uv.sources]
spectio-sdk = { workspace = true }

[build-system]
# hatchling, for the build hook that adds both engine bridges (spectio/_bridges): P1 Task 21, architecture §7.3.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectio"]

# Only these in the sdist (hatchling adds pyproject.toml and PKG-INFO), never an untracked local file.
[tool.hatch.build.targets.sdist]
only-include = ["src", "hatch_build.py"]

[tool.hatch.build.hooks.custom]  # hatch_build.py
