<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio mobile — switch project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0 0 auto 0; z-index: 1;"><dc-import name="MobileTopbar" title="Runs" sub="Liver time course · 41 runs" hint-size="390px,60px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; top: 60px; left: 0; right: 0; bottom: 0; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
    <span style="height: 44px; border-radius: 14px; background: #FFFFFF;"></span>
    <span style="height: 36px; width: 80%; border-radius: 18px; background: #FFFFFF;"></span>
    <span style="height: 104px; border-radius: 16px; background: #FFFFFF;"></span>
    <span style="height: 104px; border-radius: 16px; background: #FFFFFF;"></span>
    <span style="height: 104px; border-radius: 16px; background: #FFFFFF;"></span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: rgba(15,16,32,0.40);"></div>

  <section role="dialog" aria-label="Switch project" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 32px -12px rgba(15,16,32,0.35); padding: 8px 12px 92px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;">
    <span style="width: 38px; height: 4px; border-radius: 2px; background: #DFE1EA; margin: 0 auto 6px;"></span>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px;">
      <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px;">Switch project</h2>
      <a href="MRuns.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #33364A; margin-right: -8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></a>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: #F7F7FB; color: #6E7287; margin: 0 4px 4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg>
      <input type="search" placeholder="Search projects" aria-label="Search projects" style="border: none; outline: none; background: transparent; font: 15px 'Inter', sans-serif; color: #0F1020; flex-grow: 1; min-width: 0;">
    </label>
    <div role="listbox" aria-label="Projects" style="display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="5">
        <a href="MRuns.dc.html" role="option" aria-selected="{{p.sel}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; border-radius: 14px; text-decoration: none; color: inherit; background: {{p.bg}};">
          <span style="width: 12px; height: 12px; border-radius: 4px; background: {{p.dot}}; flex-shrink: 0;"></span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span>
            <span style="font-size: 12.5px; color: #4D5065;">{{p.group}} · {{p.role}}</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.chk}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
        </a>
      </sc-for>
    </div>
    <a href="Projects.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-top: 1px solid #EEEFF5; margin-top: 4px; text-decoration: none; color: #6344B2; font-size: 15px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>All projects and sharing
    </a>
  </section>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;"><dc-import name="MobileTabbar" active="runs" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const p = (name, group, role, dot, on) => ({ name, group, role, dot, sel: on ? 'true' : 'false', bg: on ? '#F6F2FE' : 'transparent', chk: on ? '#7750D4' : 'transparent' });
  return { projects: [
    p('Liver time course', 'rnaseq-core', 'Owner', '#7750D4', true),
    p('Drug screen 2026', 'imaging-core', 'Reviewer', '#2F7FA8'),
    p('Rare disease trios', 'clinical-genomics', 'Launcher', '#EC5F87'),
    p('PBMC atlas', 'rnaseq-core', 'Editor', '#5A4FCF'),
    p('Soil metagenomes', 'microbiome-lab', 'Viewer', '#A54666')
  ] };
}
}
</script>
</body>
</html>
