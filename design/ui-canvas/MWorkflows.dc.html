<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio mobile — workflows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0 0 auto 0; z-index: 2;"><dc-import name="MobileTopbar" title="Workflows" sub="18 in catalog" back="MMore.dc.html" hint-size="390px,60px"></dc-import></div>
  <main style="position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 12px 12px 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.09); color: #6E7287;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg>
      <input type="search" placeholder="Search workflows" aria-label="Search workflows" style="border: none; outline: none; background: transparent; font: 15px 'Inter', sans-serif; color: #0F1020; flex-grow: 1; min-width: 0;">
    </label>
    <div class="chips" role="tablist" aria-label="Workflow sources" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <span role="tab" aria-selected="{{c.sel}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}};">{{c.t}}<span style="font-weight: 500; opacity: 0.75;">{{c.n}}</span></span>
      </sc-for>
    </div>

    <a href="#" style="text-decoration: none; color: inherit; border-radius: 16px; background: #FFFBF3; box-shadow: inset 0 0 0 1px #F9DDB0; padding: 12px 14px; display: flex; gap: 12px; align-items: center;">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FDF3E2; color: #8F5806; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z M8 10l3 2-3 2 M13 15h3"/></svg></span>
      <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14.5px; font-weight: 600; color: #6B4205;">Discovered from the command line</span>
        <span style="font-size: 12.5px; color: #33364A;">lab/organoid-qc @ 7c1e2f0 · seen in 3 runs</span>
      </span>
      <span style="height: 36px; padding: 0 12px; border-radius: 11px; background: #D9890B; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; flex-shrink: 0;">Promote</span>
    </a>

    <h2 style="margin: 6px 2px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #4D5065;">CATALOG</h2>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07), 0 1px 2px rgba(15,16,32,0.05); padding: 12px 12px 12px 14px;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DFE1EA; display: flex; align-items: center; justify-content: center;"><img src="{{r.logo}}" width="24" height="24" alt="{{r.engine}}" style="display: block; object-fit: contain;"></span>
        <a href="Workflows.dc.html" style="flex-grow: 1; min-width: 0; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #4D5065; white-space: nowrap;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px;">{{r.ver}}</span>·<span style="width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}; flex-shrink: 0;" title="{{r.last}}"></span>{{r.runs}}</span>
        </a>
        <a href="MLaunch.dc.html" style="height: 36px; padding: 0 12px; border-radius: 11px; box-shadow: inset 0 0 0 1px #D8C8FC; background: #FBF9FF; color: #4D368B; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; flex-shrink: 0;">Launch</a>
      </div>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;"><dc-import name="MobileTabbar" active="more" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const E = { nfcore: ['nf-core', '/_blob/b04c0e1634ffbccff3a43d65ce1316d4'], nf: ['Nextflow', '/_blob/636203cdee0bc09b61efe0fa351e239b'], smk: ['Snakemake', '/_blob/7a35665829f51132cb3bcb9a4c3e638c'] };
  const D = { run: ['#3B82F6', 'last run running'], done: ['#1F9D63', 'last run succeeded'], fail: ['#DC3B3B', 'last run failed'], review: ['#D9890B', 'last run awaiting review'] };
  const chip = (t, n, on) => ({ t, n, sel: on ? 'true' : 'false', bg: on ? '#0F1020' : '#FFFFFF', fg: on ? '#FFFFFF' : '#22253A', ring: on ? 'none' : 'inset 0 0 0 1px #DFE1EA' });
  const row = (name, eng, ver, st, runs) => { const [engine, logo] = E[eng]; const [dot, last] = D[st]; return { name, engine, logo, ver, dot, last, runs }; };
  return {
    chips: [chip('Catalog', '18', true), chip('nf-core', '124'), chip('Snakemake catalog', ''), chip('Discovered', '4')],
    rows: [
      row('nf-core/rnaseq', 'nfcore', '3.27.0', 'run', '27 runs'),
      row('nf-core/sarek', 'nfcore', '3.6.1', 'review', '14 runs'),
      row('cellpose-segmentation', 'smk', '1.4.0', 'review', '33 runs'),
      row('dna-seq-varlociraptor', 'smk', '5.2.1', 'fail', '9 runs'),
      row('nf-core/scrnaseq', 'nfcore', '4.1.0', 'run', '6 runs'),
      row('methylseq-custom', 'nf', 'main@a1c9f2e', 'done', '4 runs'),
      row('atac-seq', 'smk', '2.1.0', 'done', '12 runs')
    ]
  };
}
}
</script>
</body>
</html>
