<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio 0.0.1 — top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5065}a:hover{color:#0F1020}
</style>
</helmet>
<div style="width: 100%; min-width: 320px; box-sizing: border-box; padding: 10px; font-family: 'Inter', system-ui, sans-serif; color: #0F1020;">
  <header style="min-height: 56px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 0 0 1px rgba(15,16,32,0.11), 0 1px 2px rgba(15,16,32,0.05), 0 10px 28px -18px rgba(15,16,32,0.18); padding: 8px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
    <nav aria-label="Breadcrumb" style="font-size: 14px; color: #4D5065; flex-grow: 1; min-width: 0;"><span style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{crumbs}}</span></nav>
    <span style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; background: #F7F7FB; box-shadow: inset 0 0 0 1px #DFE1EA; color: #22253A; font-size: 13px; font-weight: 500; white-space: nowrap;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7FA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v6H4z M4 13h16v6H4z M8 8h.01 M8 16h.01"/></svg>
      SLURM · server on {{node}}
    </span>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumbs":{"editor":"text","default":"Runs"},"$preview":{"width":1440,"height":76}}'>
class Component extends DCLogic {
renderVals() {
  return { crumbs: this.props.crumbs ?? 'Runs', node: 'login1' };
}
}
</script>
</body>
</html>
