<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio — administration section nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.an-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;text-decoration:none;font-size:13.5px;white-space:nowrap}
.an-item:hover{background:#F1F2F6;color:#0F1020}
.an-item:focus-visible{outline:2px solid #7750D4;outline-offset:1px}
</style>
</helmet>
<nav aria-label="Administration sections" style="width: 208px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;">
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #6E7287; padding: 0 10px 4px;">{{g.label}}</span>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
        <a class="an-item" href="{{it.href}}" aria-current="{{it.cur}}" style="background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.w}};">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{it.icon}}"/></svg>
          <span style="flex-grow: 1;">{{it.label}}</span>
          <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{it.bbg}}; color: {{it.bfg}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{it.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["users","groups","service","projects","workflows","environments","tasks","runners","events","logs","health","audit","branding","plugins","ai","notifications","backups","maintenance","settings"],"default":"users"},"$preview":{"width":208,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const active = this.props.active ?? 'users';
  // [id, label, href, icon, iconColour, badge, badgeBg, badgeFg]
  const G = [
    ['PEOPLE', [

      ['groups', 'Groups', 'AdminGroups.dc.html', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M2 21a7 7 0 0 1 14 0 M17 11a3 3 0 1 0 0-6 M22 21a6 6 0 0 0-4-5.6'],
      ['service', 'Service accounts', 'SettingsServiceAccounts.dc.html', 'M12 4v3 M6 8h12v10H6z M9.5 13h.01 M14.5 13h.01 M3 12v3 M21 12v3']

      ['workflows', 'Workflows', 'Workflows.dc.html', 'M6 3v12 M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M18 9a9 9 0 0 1-9 9', '#A54666'],
      ['environments', 'Environments', 'Environments.dc.html', 'M4 5h16v6H4z M4 13h16v6H4z M8 8h.01 M8 16h.01', '#2F7FA8']

      ['plugins', 'Plugins', 'AdminPlugins.dc.html', 'M9 3v4 M15 3v4 M7 7h10v4a5 5 0 0 1-10 0z M12 16v5'],

      ['notifications', 'Notifications', '#', 'M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8 M10 20a2 2 0 0 0 4 0'],
      ['backups', 'Backups', 'AdminBackups.dc.html', 'M4 5h16v4H4z M5 9v10h14V9 M10 13h4'],
      ['maintenance', 'Maintenance', 'AdminMaintenance.dc.html', 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z'],
      ['settings', 'Settings', '#', 'M4 6h10 M18 6h2 M16 4v4 M4 12h4 M12 12h8 M10 10v4 M4 18h12 M18 16v4']
    ]]
  ];
  const groups = G.map(([label, items]) => ({
    label,
    items: items.map(([id, l, href, icon, hue, badge, bbg, bfg]) => {
      const on = id === active;
      return { label: l, href, icon, cur: on ? 'page' : 'false', bg: on ? '#F1F2F6' : 'transparent', fg: on ? '#0F1020' : '#33364A', w: on ? 600 : 500, ic: hue || (on ? '#0F1020' : '#4D5065'), hasBadge: !!badge, badge: badge || '', bbg: bbg || '#F1F2F6', bfg: bfg || '#33364A' };

  return { groups };
}
}
</script>
</body>
</html>
