<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio 0.0.1 — phone top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mk{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#33364A;text-decoration:none;flex-shrink:0}
.mk:focus-visible{outline:2px solid #7750D4;outline-offset:-2px}
</style>
</helmet>
<div style="width: 100%; height: 60px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.94); box-shadow: 0 1px 0 rgba(15,16,32,0.08); font-family: 'Inter', system-ui, sans-serif; color: #0F1020;">
  <sc-if value="{{back}}" hint-placeholder-val="{{false}}">
    <a class="mk" href="{{backHref}}" aria-label="{{backLabel}}" style="margin-left: -8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  </sc-if>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <span style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 19px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{title}}</span>
    <sc-if value="{{hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #4D5065; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{sub}}</span></sc-if>
  </div>
  <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: #E8F6EF; color: #157A4B; font-size: 12px; font-weight: 600; flex-shrink: 0;"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1F9D63;"></span>login1</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Runs"},"sub":{"editor":"text","default":""},"back":{"editor":"text","default":""},"backLabel":{"editor":"text","default":"Back"},"$preview":{"width":390,"height":60}}'>
class Component extends DCLogic {
renderVals() {
  const back = this.props.back ?? '';
  const sub = this.props.sub ?? '';
  return { title: this.props.title ?? 'Runs', sub, hasSub: !!sub, back: !!back, backHref: back || '#', backLabel: this.props.backLabel || 'Back' };
}
}
</script>
</body>
</html>
