<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio mobile — runs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0 0 auto 0; z-index: 2;"><dc-import name="MobileTopbar" title="Runs" sub="312 runs · 4 active" hint-size="390px,60px"></dc-import></div>
  <main style="position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 12px 12px 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.09); color: #6E7287;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg>
      <input type="search" placeholder="Search runs" aria-label="Search runs" style="border: none; outline: none; background: transparent; font: 15px 'Inter', sans-serif; color: #0F1020; flex-grow: 1; min-width: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33364A" stroke-width="1.8" stroke-linecap="round" aria-label="Sort and filters" role="img"><path d="M4 6h10 M18 6h2 M16 4v4 M4 12h4 M12 12h8 M10 10v4 M4 18h12 M18 16v4"/></svg>
    </label>
    <div class="chips" role="tablist" aria-label="Run filters" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <span role="tab" aria-selected="{{c.sel}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}};">{{c.t}}<span style="font-weight: 500; opacity: 0.75;">{{c.n}}</span></span>
      </sc-for>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 6px 2px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #4D5065;">{{g.title}}</h2>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <a href="MRunDetail.dc.html" style="text-decoration: none; color: inherit; display: flex; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07), 0 1px 2px rgba(15,16,32,0.05); overflow: hidden;">
            <span style="width: 4px; flex-shrink: 0; background: {{r.rail}};"></span>
            <span style="flex-grow: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
              <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{r.fg}};"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>{{r.state}}</span>
                <span style="font-size: 12px; color: #6E7287;">{{r.when}}</span>
              </span>
              <span style="display: flex; align-items: center; gap: 12px;">
                <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                  <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
                  <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #4D5065; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><img src="{{r.logo}}" width="14" height="14" alt="{{r.engine}}" style="display: block; flex-shrink: 0;">{{r.wf}}</span>
                </span>
                <svg width="52" height="26" viewBox="0 0 200 100" role="img" aria-label="{{r.prog}}" style="flex-shrink: 0;"><path d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z" fill="{{r.f0}}" stroke="{{r.s0}}" stroke-width="{{r.w0}}"/><path d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z" fill="{{r.f1}}" stroke="{{r.s1}}" stroke-width="{{r.w1}}"/><path d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z" fill="{{r.f2}}" stroke="{{r.s2}}" stroke-width="{{r.w2}}"/><path d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z" fill="{{r.f3}}" stroke="{{r.s3}}" stroke-width="{{r.w3}}"/></svg>
              </span>
              <span style="font-size: 12.5px; color: #33364A;">{{r.ctx}}</span>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;"><dc-import name="MobileTabbar" active="runs" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const I = { flag: 'M5 21V4 M5 4h12l-2.5 4 2.5 4H5', cross: 'M6 6l12 12 M18 6L6 18', play: 'M8 5v14l11-7z', check: 'M5 12l5 5L20 7', pause: 'M9 5v14 M15 5v14' };
  const S = { review: ['Awaiting review', '#D9890B', '#8F5806', I.flag], running: ['Running', '#3B82F6', '#1D5FC9', I.play], done: ['Succeeded', '#1F9D63', '#157A4B', I.check], failed: ['Failed', '#DC3B3B', '#B02A2A', I.cross], paused: ['Paused', '#8B5CF6', '#6344B2', I.pause] };
  const E = { nfcore: ['nf-core', '/_blob/b04c0e1634ffbccff3a43d65ce1316d4'], smk: ['Snakemake', '/_blob/7a35665829f51132cb3bcb9a4c3e638c'], nf: ['Nextflow', '/_blob/636203cdee0bc09b61efe0fa351e239b'] };
  const B = ['#5A4FCF','#8B5CF6','#EC5F87','#F9A947'], T = ['#A39CE4','#BEA4FA','#F4A5BC','#FCCF98'], off = '#DFE1EA';
  const gauge = (spec) => { const o = {}; spec.forEach((s, i) => { let f = off, st = 'none', w = 0; if (s === 'd') f = B[i]; if (s === 'r') f = T[i]; if (s === 'g') { f = '#FDF3E2'; st = '#D9890B'; w = 9; } if (s === 'x') f = '#DC3B3B'; o['f'+i] = f; o['s'+i] = st; o['w'+i] = w; }); return o; };
  const row = (st, name, eng, wf, spec, prog, ctx, when) => { const [state, rail, fg, icon] = S[st]; const [engine, logo] = E[eng]; return { state, rail, fg, icon, name, engine, logo, wf, prog, ctx, when, ...gauge(spec) }; };
  const chip = (t, n, on) => ({ t, n, sel: on ? 'true' : 'false', bg: on ? '#0F1020' : '#FFFFFF', fg: on ? '#FFFFFF' : '#22253A', ring: on ? 'none' : 'inset 0 0 0 1px #DFE1EA' });
  return {
    chips: [chip('All', '312', true), chip('Active', '4'), chip('Needs attention', '3'), chip('Failed', '2'), chip('Mine', '41')],
    groups: [
      { title: 'NEEDS ATTENTION', rows: [
        row('review', 'imaging-cellpose · plate 07', 'smk', 'cellpose-segmentation 1.4.0', ['d','g','t','t'], 'Gate after stage 2 of 4', 'Gate “Segmentation QC” · AI suggestion ready', '47 min'),
        row('failed', 'variant-calling-wgs', 'smk', 'dna-seq-varlociraptor 5.2.1', ['x','t','t','t'], 'Failed in stage 1 of 4', 'bwa_mem out of memory · resumable', '2 h'),
        row('paused', 'sarek-trio-02', 'nfcore', 'nf-core/sarek 3.10.0', ['d','d','t','t'], 'Paused after stage 2 of 4', 'Paused by Alice', 'yesterday')
      ] },
      { title: 'ACTIVE AND RECENT', rows: [
        row('running', 'rnaseq-2026-10-25', 'nfcore', 'nf-core/rnaseq 3.27.0', ['d','d','r','t'], 'Stage 3 of 4', 'Quantification · 812 / 1,248 tasks', '1 h 05'),
        row('running', 'scrna-pbmc', 'nfcore', 'nf-core/scrnaseq 4.2.0', ['r','t','t','t'], 'Task quarter 1 of 4', '38 / 410 tasks', '8 min'),
        row('done', 'atac-batch-07', 'smk', 'atac-seq 2.1.0', ['d','d','d','d'], '4 of 4 stages', '3 h 12 · MultiQC ready', 'yesterday')
      ] }
    ]
  };
}
}
</script>
</body>
</html>
