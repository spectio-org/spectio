<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio — runs, rows mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
a{color:#6344B2}a:hover{color:#4D368B}
</style>
</helmet>
<div style="width: 100%; height: 100vh; min-height: 760px; box-sizing: border-box; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: auto minmax(0, 1fr);">
  <div style="grid-column: 1 / 3;"><dc-import name="AppTopbar" crumbs="Runs" hint-size="100%,76px"></dc-import></div>
  <div style="min-height: 0; display: flex; flex-direction: column;"><dc-import name="AppSidebar" active="runs" hint-size="276px,100%" style="display: block; flex: 1 1 auto; min-height: 0;"></dc-import></div>
    <main style="min-height: 0; overflow: auto; min-width: 0; padding: 8px 24px 32px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">

      <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
        <span style="width: 48px; height: 48px; border-radius: 15px; background: #F6F2FE; color: #6344B2; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l14 8-14 8z"/></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 28px;">Runs</h1>
          <span style="font-size: 14px; color: #4D5065;">312 runs · 4 active · 3 awaiting review</span>
        </div>
        <div role="group" aria-label="View mode" style="display: flex; padding: 3px; border-radius: 12px; background: #E6E7EF;">
          <a href="RunsTable.dc.html" style="height: 34px; padding: 0 12px; border-radius: 9px; color: #4D5065; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center;">Table</a>
          <a href="RunsRows.dc.html" aria-current="page" style="height: 34px; padding: 0 12px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,16,32,0.12); color: #0F1020; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">Rows</a>
        </div>
        <a href="Launch.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #7750D4; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center;">Launch a run</a>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 8px;">
          <h2 style="margin: 6px 0 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; color: #4D5065;">{{g.title}}</h2>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="RunDetail.dc.html" style="text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px rgba(15,16,32,0.08), 0 1px 2px rgba(15,16,32,0.05); display: flex; align-items: stretch; overflow: hidden;">
              <span style="width: 4px; flex-shrink: 0; background: {{r.rail}};"></span>
              <span style="flex-grow: 1; min-width: 0; padding: 14px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;">
                <svg width="64" height="32" viewBox="0 0 200 100" role="img" aria-label="{{r.prog}}" style="flex-shrink: 0;">
                  <path d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z" fill="{{r.f0}}" stroke="{{r.s0}}" stroke-width="{{r.w0}}"/><path d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z" fill="{{r.f1}}" stroke="{{r.s1}}" stroke-width="{{r.w1}}"/><path d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z" fill="{{r.f2}}" stroke="{{r.s2}}" stroke-width="{{r.w2}}"/><path d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z" fill="{{r.f3}}" stroke="{{r.s3}}" stroke-width="{{r.w3}}"/>
                </svg>
                <span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                  <span style="font-size: 15.5px; font-weight: 600;">{{r.name}} <span style="font-size: 12px; font-weight: 500; color: #6E7287; font-family: 'JetBrains Mono', monospace;">{{r.id}}</span></span>
                  <span style="display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #33364A;">
                    <img src="{{r.logo}}" width="16" height="16" alt="{{r.engine}}" title="{{r.engine}}" style="display: block; object-fit: contain;">{{r.wf}} <span style="color: #6E7287;">· {{r.env}} · {{r.origin}}</span>
                  </span>
                </span>
                <span style="flex: 0 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                  <span style="display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: {{r.fg}};">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>{{r.state}}
                  </span>
                  <span style="font-size: 12.5px; color: #4D5065;">{{r.ctx}}</span>
                </span>
                <span style="flex: 0 0 auto; font-size: 12.5px; color: #4D5065; text-align: right; min-width: 90px;">{{r.when}}</span>
                <span style="flex: 0 0 auto; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; background: {{r.abg}}; color: {{r.afg}}; box-shadow: {{r.aring}};">{{r.action}}</span>
              </span>
            </a>
          </sc-for>
        </section>
      </sc-for>
    </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
renderVals() {
  const I = { flag: 'M5 21V4 M5 4h12l-2.5 4 2.5 4H5', cross: 'M6 6l12 12 M18 6L6 18', play: 'M8 5v14l11-7z', check: 'M5 12l5 5L20 7', pause: 'M9 5v14 M15 5v14', clock: 'M12 7v5l3 2 M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0' };
  const S = { review: ['Awaiting review', '#D9890B', '#8F5806', I.flag], running: ['Running', '#3B82F6', '#1D5FC9', I.play], done: ['Succeeded', '#1F9D63', '#157A4B', I.check], failed: ['Failed', '#DC3B3B', '#B02A2A', I.cross], paused: ['Paused', '#8B5CF6', '#6344B2', I.pause], queued: ['Queued', '#6E7287', '#33364A', I.clock] };
  const E = { nf: ['Nextflow', '/_blob/636203cdee0bc09b61efe0fa351e239b'], nfcore: ['nf-core (Nextflow)', '/_blob/b04c0e1634ffbccff3a43d65ce1316d4'], smk: ['Snakemake', '/_blob/7a35665829f51132cb3bcb9a4c3e638c'] };
  const A = { primary: ['#FDF3E2', '#6B4205', 'none'], quiet: ['#FFFFFF', '#22253A', 'inset 0 0 0 1px #DFE1EA'] };
  const B = ['#5A4FCF','#8B5CF6','#EC5F87','#F9A947'], T = ['#A39CE4','#BEA4FA','#F4A5BC','#FCCF98'], off = '#DFE1EA';
  const gauge = (spec) => { const o = {}; spec.forEach((s, i) => { let f = off, st = 'none', w = 0; if (s === 'd') f = B[i]; if (s === 'r') f = T[i]; if (s === 'g') { f = '#FDF3E2'; st = '#D9890B'; w = 9; } if (s === 'x') f = '#DC3B3B'; o['f'+i] = f; o['s'+i] = st; o['w'+i] = w; }); return o; };
  let n = 312;
  const row = (st, name, eng, wf, spec, prog, ctx, env, origin, when, action, kind) => {
    const [state, rail, fg, icon] = S[st]; const [engine, logo] = E[eng]; const [abg, afg, aring] = A[kind];
    return { id: '#' + (n--), state, rail, fg, icon, name, engine, logo, wf, prog, ctx, env, origin, when, action, abg, afg, aring, ...gauge(spec) };
  };
  return { groups: [
    { title: 'NEEDS ATTENTION', rows: [
      row('review', 'imaging-cellpose', 'smk', 'cellpose-segmentation 1.4.0', ['d','g','t','t'], 'Gate after stage 2 of 4', 'Gate “Segmentation QC” · AI proposal ready', 'EMBL SLURM', 'Launched in UI', 'waiting 47 min', 'Review', 'primary'),
      row('failed', 'variant-calling-wgs', 'smk', 'dna-seq-varlociraptor 5.2.1', ['x','t','t','t'], 'Failed in stage 1 of 4', 'bwa_mem exit 137 (out of memory) · resumable', 'EMBL SLURM', 'CLI · adopted', '2 h 14 ago', 'Resume…', 'quiet'),
      row('paused', 'sarek-trio-02', 'nfcore', 'nf-core/sarek 3.6.1', ['d','d','t','t'], 'Paused after stage 2 of 4', 'Paused by Thomas · resumable', 'EMBL SLURM', 'Launched in UI', 'yesterday 17:20', 'Continue', 'quiet')
    ] },
    { title: 'ACTIVE AND RECENT', rows: [
      row('running', 'rnaseq-2026-10-25', 'nfcore', 'nf-core/rnaseq 3.27.0', ['d','d','r','t'], 'Stage 3 of 4', 'Quantification · 812 / 1,248 tasks', 'EMBL SLURM', 'Launched in UI', 'started 1 h 05 ago', 'Open', 'quiet'),
      row('running', 'scrna-pbmc', 'nfcore', 'nf-core/scrnaseq 4.1.0', ['r','t','t','t'], 'Task quarter 1 of 4', 'No stages declared · 38 / 410 tasks', 'Kubernetes · dev', 'Launched in UI', 'started 8 min ago', 'Open', 'quiet'),
      row('queued', 'methylseq-pilot', 'nf', 'methylseq-custom main@a1c9f2e', ['t','t','t','t'], 'Not started', 'Waiting for a runner', 'Workstation', 'CLI · observed', '2 min ago', 'Open', 'quiet'),
      row('done', 'atac-batch-07', 'smk', 'atac-seq 2.1.0', ['d','d','d','d'], '4 of 4 stages', '3 h 12 · MultiQC ready', 'EMBL SLURM', 'Rerun from stage 2', 'yesterday 21:03', 'Reports', 'quiet')
    ] }
  ] };
}
}
</script>
</body>
</html>
