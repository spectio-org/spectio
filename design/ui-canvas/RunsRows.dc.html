<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio — runs, rows mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
a{color:#6344B2}a:hover{color:#4D368B}
</style>
</helmet>
<div style="width: 100%; height: 100vh; min-height: 760px; box-sizing: border-box; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: auto minmax(0, 1fr);">
  <div style="grid-column: 1 / 3;"><dc-import name="AppTopbar" crumbs="Runs" hint-size="100%,76px"></dc-import></div>
  <div style="min-height: 0; display: flex; flex-direction: column;"><dc-import name="AppSidebar" active="runs" hint-size="276px,100%" style="display: block; flex: 1 1 auto; min-height: 0;"></dc-import></div>
    <main style="min-height: 0; overflow: auto; min-width: 0; padding: 8px 24px 32px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
        <span style="width: 48px; height: 48px; border-radius: 15px; background: #F6F2FE; color: #6344B2; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l14 8-14 8z"/></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 28px;">Runs</h1>
          <span style="font-size: 14px; color: #4D5065;">2,946 runs · 11 active · 27 awaiting review · last 7 days: 173 of 214 runs had no gate and went straight through</span>
        </div>
        <div role="group" aria-label="View mode" style="display: flex; padding: 3px; border-radius: 12px; background: #E6E7EF;">
          <a href="RunsTable.dc.html" style="height: 34px; padding: 0 12px; border-radius: 9px; color: #4D5065; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center;">Table</a>
          <a href="RunsRows.dc.html" aria-current="page" style="height: 34px; padding: 0 12px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,16,32,0.12); color: #0F1020; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">Rows</a>
        </div>
        <a href="Launch.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #7750D4; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center;">Launch a run</a>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 8px;">
          <h2 style="margin: 6px 0 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; color: #4D5065; display: flex; gap: 12px; align-items: baseline; white-space: nowrap;">{{g.title}}<span style="flex-grow: 1;"></span><span style="font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: #6E7287;">{{g.cap}}</span></h2>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="text-decoration: none; color: inherit; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px rgba(15,16,32,0.08), 0 1px 2px rgba(15,16,32,0.05); display: flex; align-items: stretch; overflow: hidden;">
              <span style="width: 4px; flex-shrink: 0; background: {{r.rail}};"></span>
              <span style="flex-grow: 1; min-width: 0; padding: 9px 18px; display: flex; align-items: center; gap: 18px;">
                <svg width="56" height="28" viewBox="0 0 200 100" role="img" aria-label="{{r.prog}}, {{r.gates}}" style="flex-shrink: 0;">
                  <path d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z" fill="{{r.f0}}" stroke="{{r.s0}}" stroke-width="{{r.w0}}"/><path d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z" fill="{{r.f1}}" stroke="{{r.s1}}" stroke-width="{{r.w1}}"/><path d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z" fill="{{r.f2}}" stroke="{{r.s2}}" stroke-width="{{r.w2}}"/><path d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z" fill="{{r.f3}}" stroke="{{r.s3}}" stroke-width="{{r.w3}}"/>
                </svg>
                <span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                  <span style="font-size: 15.5px; font-weight: 600;">{{r.name}} <span style="font-size: 12px; font-weight: 500; color: #6E7287; font-family: 'JetBrains Mono', monospace;">{{r.id}}</span></span>
                  <span style="display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #33364A; white-space: nowrap; min-width: 0;">
                    <img src="{{r.logo}}" width="16" height="16" alt="{{r.engine}}" title="{{r.engine}}" style="display: block; object-fit: contain; flex-shrink: 0;">{{r.wf}} <span style="color: #6E7287; overflow: hidden; text-overflow: ellipsis;">· {{r.env}} · {{r.origin}}</span>
                    <span style="flex-shrink: 0; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 6px; color: {{r.gfg}}; background: {{r.gbg}};">{{r.gates}}</span>
                  </span>
                </span>
                <span style="flex: 0 1 330px; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                  <span style="display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: {{r.fg}};">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>{{r.state}}
                  </span>
                  <span title="{{r.ctx}}" style="font-size: 12.5px; color: #4D5065; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.ctx}}</span>
                </span>
                <span style="flex: 0 0 118px; font-size: 12.5px; color: #4D5065; text-align: right;">{{r.when}}</span>
                <span style="flex: 0 0 auto; min-width: 84px; justify-content: center; box-sizing: border-box; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; background: {{r.abg}}; color: {{r.afg}}; box-shadow: {{r.aring}};">{{r.action}}</span>
              </span>
            </a>
          </sc-for>
        </section>
      </sc-for>
    </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
  const I = { flag: 'M5 21V4 M5 4h12l-2.5 4 2.5 4H5', cross: 'M6 6l12 12 M18 6L6 18', play: 'M8 5v14l11-7z', check: 'M5 12l5 5L20 7', pause: 'M9 5v14 M15 5v14', clock: 'M12 7v5l3 2 M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0', ban: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0 M5.6 18.4L18.4 5.6' };
  const S = { review: ['Awaiting review', '#D9890B', '#8F5806', I.flag], running: ['Running', '#3B82F6', '#1D5FC9', I.play], done: ['Succeeded', '#1F9D63', '#157A4B', I.check], failed: ['Failed', '#DC3B3B', '#B02A2A', I.cross], paused: ['Paused', '#8B5CF6', '#6344B2', I.pause], queued: ['Queued', '#6E7287', '#33364A', I.clock], cancelled: ['Cancelled', '#4D5065', '#33364A', I.ban] };
  const E = { nf: ['Nextflow', '/_blob/636203cdee0bc09b61efe0fa351e239b'], nfcore: ['nf-core (Nextflow)', '/_blob/b04c0e1634ffbccff3a43d65ce1316d4'], smk: ['Snakemake', '/_blob/7a35665829f51132cb3bcb9a4c3e638c'] };
  const A = { primary: ['#FDF3E2', '#6B4205', 'none'], quiet: ['#FFFFFF', '#22253A', 'inset 0 0 0 1px #DFE1EA'] };
  const B = ['#5A4FCF','#8B5CF6','#EC5F87','#F9A947'], T = ['#A39CE4','#BEA4FA','#F4A5BC','#FCCF98'], off = '#DFE1EA';
  const gauge = (spec) => { const o = {}; spec.forEach((s, i) => { let f = off, st = 'none', w = 0; if (s === 'd') f = B[i]; if (s === 'r') f = T[i]; if (s === 'g') { f = '#FDF3E2'; st = '#D9890B'; w = 9; } if (s === 'x') f = '#DC3B3B'; o['f'+i] = f; o['s'+i] = st; o['w'+i] = w; }); return o; };
  const GT = { none: ['no gate', '#4D5065', '#EEEFF5'], det: ['detected stages · no gate', '#4D5065', '#EEEFF5'], ov: ['lab overlay · 1 gate', '#6B4205', '#FDF3E2'], yml: ['spectio.yml · 1 gate', '#6B4205', '#FDF3E2'] };
  const HPC = 'demo-hpc', GPU = 'demo-hpc gpu', K8S = 'k8s-dev';
  const row = (id, st, name, eng, wf, spec, prog, gt, ctx, env, origin, when, action, kind, href) => {
    const [state, rail, fg, icon] = S[st]; const [engine, logo] = E[eng]; const [abg, afg, aring] = A[kind]; const [gates, gfg, gbg] = GT[gt];
    return { id, state, rail, fg, icon, name, engine, logo, wf, prog, gates, gfg, gbg, ctx, env, origin, when, action, abg, afg, aring, href: href || 'RunDetail.dc.html', ...gauge(spec) };
  };
  return { groups: [
    { title: 'NEEDS ATTENTION · 6', cap: 'Data: failures and task counts from nf-core megatests sarek 3.10.0 (results-8ccac7a), rnaseq 3.27.0 (results-a1fcddd); the rest is fixture data', rows: [
      row('#361', 'review', 'pf-kinases-1200', 'nfcore', 'nf-core/proteinfold 1.1.1', ['d','g','t','t'], 'Run-level gate after stage 2 of 4', 'ov', 'GPU stage approval · waits for the LIMS gpu-budget signal', HPC, 'API · LIMS', 'waiting 6 h 20', 'Review', 'primary', 'ReviewSignal.dc.html'),
      row('#433', 'review', 'mshef-wgbs', 'nfcore', 'nf-core/methylseq 4.2.0', ['d','d','g','t'], 'Gate after stage 3 of 4', 'ov', 'Bisulfite conversion · MShef4_J1 98.31 %, below 99 %', HPC, 'UI · Chloé Diallo', 'waiting 5 h 20', 'Review', 'primary', 'ReviewMethyl.dc.html'),
      row('#427', 'review', 'foxa1-ezh2', 'nfcore', 'nf-core/chipseq 2.1.0', ['d','d','g','t'], 'Gate after stage 3 of 4', 'ov', 'Peak QC with inputs · EZH2_IP_TKO_REP2 below the FRiP minimum', HPC, 'UI · Chloé Diallo', 'waiting 2 h 10', 'Review', 'primary', 'ReviewChip.dc.html'),
      row('#405', 'failed', 'sarek-wgs-na12878', 'nfcore', 'nf-core/sarek 3.10.0', ['d','d','d','x'], 'Failed in quarter 4 of 4', 'none', 'DEEPVARIANT_RUNDEEPVARIANT (NA12878) exit 1 · 89 tasks aborted · resumable', HPC, 'UI · Dmitri Novak', 'Sun 22:56', 'Resume…', 'quiet'),
      row('#398', 'failed', 'rnaseq-3.27-validation', 'nfcore', 'nf-core/rnaseq 3.27.0', ['d','d','d','x'], 'Failed in quarter 4 of 4', 'none', 'RSEM_CALCULATEEXPRESSION (H1_REP2) exit 175 after 2 attempts · resumable', HPC, 'API · CI', 'Sun 23:01', 'Resume…', 'quiet'),
      row('#314', 'failed', 'wgs-cohort-12', 'smk', 'wgs-germline v1.3.0', ['d','d','x','t'], 'Failed in stage 3 of 4', 'det', '2 jobs failed after retries · 143 / 175 jobs done', HPC, 'UI · Dmitri Novak', 'Sun 06:57', 'Resume…', 'quiet', 'RunFailed.dc.html')
    ] },
    { title: 'ACTIVE AND RECENT', cap: '', rows: [
      row('#422', 'queued', 'nanoseq-cdna-02', 'nfcore', 'nf-core/nanoseq 3.1.0', ['t','t','t','t'], 'Not started', 'none', 'Waiting for SLURM · gpu partition, position 3', GPU, 'UI · Bruno Keller', '2 min ago', 'Open', 'quiet'),
      row('#446', 'running', 'rnaseq-2026-10-25', 'nfcore', 'nf-core/rnaseq 3.27.0', ['d','d','r','t'], 'Stage 3 of 4', 'ov', 'Quantification · 812 / 1,248 tasks', HPC, 'UI · Alice Martin', 'started 1 h 05 ago', 'Open', 'quiet'),
      row('#420', 'running', 'demux-NX-1026', 'nfcore', 'nf-core/demultiplex 1.8.0', ['d','d','r','t'], 'Task quarter 3 of 4', 'none', 'No stages declared · bcl-convert on 4 lanes · 68 % tasks', HPC, 'API · sequencer', 'started 49 min ago', 'Open', 'quiet'),
      row('#415', 'running', 'ki-screen-p05', 'smk', 'plate-qc 1.4.0', ['d','r','t','t'], 'Stage 2 of 4', 'yml', 'Batch ki-screen-2026-10-26 · run 5 of 12 · Well QC gate after stage 3', HPC, 'Batch · 5 / 12', 'started 34 min ago', 'Batch', 'quiet', 'LaunchBatch.dc.html'),
      row('#447', 'running', 'sharp_lovelace', 'nfcore', 'nf-core/rnaseq 3.27.0', ['d','r','r','t'], '3 detected stages active', 'det', 'Observed from the CLI · 442 / 881 known tasks · not adopted', HPC, 'CLI · observed', 'started 2 h 08 ago', 'Adopt…', 'quiet', 'RunObserved.dc.html'),
      row('#419', 'running', 'cutrun-h3k27me3-05', 'nfcore', 'nf-core/cutandrun 3.2.2', ['d','r','t','t'], 'Task quarter 2 of 4', 'none', 'No stages declared · 41 % tasks', K8S, 'UI · Bruno Keller', 'started 1 h 30 ago', 'Open', 'quiet'),
      row('#416', 'done', 'fetch-geo-2610', 'nfcore', 'nf-core/fetchngs 1.13.0', ['d','d','d','d'], '4 of 4 quarters', 'none', 'FastQ files and samplesheet ready · utility, no review', HPC, 'API · lims-sync', 'today 07:39', 'Outputs', 'quiet', 'RunOutputs.dc.html'),
      row('#404', 'done', 'atac-limb-e11', 'nfcore', 'nf-core/atacseq 2.1.2', ['d','d','d','d'], '4 of 4 quarters', 'none', '3 h 48 · MultiQC ready', HPC, 'CLI · adopted', 'Sun 19:50', 'Reports', 'quiet', 'RunOutputs.dc.html'),
      row('#395', 'cancelled', 'esmfold-panel-04', 'nfcore', 'nf-core/proteinfold 2.0.0', ['d','t','t','t'], 'Cancelled in quarter 1 of 4', 'none', 'Cancelled by Dmitri Novak after 38 min · replaced by #399', GPU, 'UI · Dmitri Novak', 'Fri 17:18', 'Open', 'quiet')
    ] }
  ] };
}
}
</script>
</body>
</html>
