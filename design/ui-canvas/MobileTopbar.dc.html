<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio — mobile top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.spx-b{transform-box:view-box;transform-origin:100px 100px;animation:spx-open 1.1s cubic-bezier(.22,1.2,.36,1) .15s both}
@keyframes spx-open{from{transform:rotate(var(--r))}to{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){.spx-b{animation:none}}
.mk{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#33364A;text-decoration:none;flex-shrink:0}
</style>
</helmet>
<div style="width: 100%; height: 60px; box-sizing: border-box; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.94); box-shadow: 0 1px 0 rgba(15,16,32,0.08); font-family: 'Inter', system-ui, sans-serif; color: #0F1020;">
  <sc-if value="{{back}}" hint-placeholder-val="{{false}}">
    <a class="mk" href="{{backHref}}" aria-label="Back" style="margin-left: -6px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  </sc-if>
  <sc-if value="{{home}}" hint-placeholder-val="{{true}}">
    <a href="MOverview.dc.html" aria-label="Spectio home" style="display: flex; flex-shrink: 0;">
      <svg width="34" height="17" viewBox="0 0 200 100" aria-hidden="true" style="overflow: visible;">
        <path class="spx-b" style="--r: 67.5deg;" fill="#5A4FCF" d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z"/><path class="spx-b" style="--r: 22.5deg;" fill="#8B5CF6" d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z"/><path class="spx-b" style="--r: -22.5deg;" fill="#EC5F87" d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z"/><path class="spx-b" style="--r: -67.5deg;" fill="#F9A947" d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z"/>
      </svg>
    </a>
  </sc-if>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <span style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 19px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{title}}</span>
    <sc-if value="{{hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #4D5065; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{sub}}</span></sc-if>
  </div>
  <a class="mk" href="#" aria-label="Search"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg></a>
  <a class="mk" href="#" aria-label="Notifications, 3 unread" style="position: relative;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8 M10 20a2 2 0 0 0 4 0"/></svg><span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: #D9890B; box-shadow: 0 0 0 2px #FFFFFF;"></span></a>
  <a href="MMore.dc.html" aria-label="Your profile" style="width: 32px; height: 32px; border-radius: 16px; background: #8B5CF6; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">AM</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Runs"},"sub":{"editor":"text","default":""},"back":{"editor":"text","default":""},"$preview":{"width":390,"height":60}}'>
class Component extends DCLogic {
renderVals() {
  const back = this.props.back ?? '';
  const sub = this.props.sub ?? '';
  return { title: this.props.title ?? 'Runs', sub, hasSub: !!sub, back: !!back, home: !back, backHref: back || '#' };
}
}
</script>
</body>
</html>
