<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio — top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5065}a:hover{color:#0F1020}
/* Panorama mark: on load the blades open like a widening field of view; on hover a beam sweeps across. */
.spx-b,.spx-s{transform-box:view-box;transform-origin:100px 100px}
.spx-b{animation:spx-open 1.1s cubic-bezier(.22,1.2,.36,1) .15s both}
.spx-s{opacity:0}
.spx-home:hover .spx-s,.spx-home:focus-visible .spx-s{animation:spx-scan 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spx-open{from{transform:rotate(var(--r))}to{transform:rotate(0)}}
@keyframes spx-scan{0%{transform:rotate(-95deg);opacity:0}10%{opacity:1}80%{transform:rotate(95deg);opacity:1}81%,100%{transform:rotate(95deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.spx-b,.spx-home:hover .spx-s{animation:none}}
.tb-key{width:40px;height:40px;border:none;border-radius:12px;background:transparent;color:#33364A;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb-key:hover{background:#F1F2F6}
</style>
</helmet>
<div style="width: 100%; min-width: 320px; box-sizing: border-box; padding: 10px; font-family: 'Inter', system-ui, sans-serif; color: #0F1020;">
  <header style="min-height: 56px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 0 0 1px rgba(15,16,32,0.11), 0 1px 2px rgba(15,16,32,0.05), 0 10px 28px -18px rgba(15,16,32,0.18); padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
    <a class="spx-home" href="Overview.dc.html" aria-label="Spectio home" style="display: flex; align-items: flex-end; gap: 9px; text-decoration: none;">
      <svg width="44" height="22" viewBox="0 0 200 100" aria-hidden="true" style="overflow: visible; margin-bottom: -1px;">
        <defs>
          <clipPath id="spx-fan"><path d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z"/><path d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z"/><path d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z"/><path d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z"/></clipPath>
          <linearGradient id="spx-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
        </defs>
        <path class="spx-b" style="--r: 67.5deg;" fill="#5A4FCF" d="M86.09 94.24L4.17 94.24A96 96 0 0 1 28.17 36.31Z"/>
        <path class="spx-b" style="--r: 22.5deg;" fill="#8B5CF6" d="M94.24 86.09L36.31 28.17A96 96 0 0 1 94.24 4.17Z"/>
        <path class="spx-b" style="--r: -22.5deg;" fill="#EC5F87" d="M105.76 86.09L105.76 4.17A96 96 0 0 1 163.69 28.17Z"/>
        <path class="spx-b" style="--r: -67.5deg;" fill="#F9A947" d="M113.91 94.24L171.83 36.31A96 96 0 0 1 195.83 94.24Z"/>
        <g clip-path="url(#spx-fan)"><path class="spx-s" fill="url(#spx-beam)" d="M100 100 L74.12 3.41 A100 100 0 0 1 125.88 3.41 Z"/></g>
      </svg>
      <img src="/_blob/7a570e2329427ff0980a12d04b41cb41" alt="" style="height: 18px; width: auto;">
    </a>
    <span style="width: 1px; height: 22px; background: #DFE1EA;"></span>
    <sc-if value="{{hasProject}}" hint-placeholder-val="{{false}}">
      <a href="Projects.dc.html" title="Switch project" aria-label="Current project: {{project}}. Switch project" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-radius: 10px; background: #F7F7FB; box-shadow: inset 0 0 0 1px #DFE1EA; color: #22253A; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; max-width: 300px;">
        <span style="width: 9px; height: 9px; border-radius: 3px; background: #7750D4; flex-shrink: 0;"></span>
        <span style="overflow: hidden; text-overflow: ellipsis;">{{project}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E7287" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </sc-if>
    <span style="font-size: 14px; color: #4D5065; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{crumbs}}</span>
    <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; background: #F7F7FB; box-shadow: inset 0 0 0 1px #EEEFF5; color: #6E7287; font-size: 13px; min-width: 260px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg>
      <input type="search" placeholder="Search runs, workflows, tasks" aria-label="Search" style="border: none; background: transparent; outline: none; font: inherit; color: #0F1020; flex-grow: 1; min-width: 0;">
      <span style="font-size: 11px; border: 1px solid #DFE1EA; border-radius: 6px; padding: 1px 6px;">⌘K</span>
    </label>
    <button type="button" class="tb-key" aria-label="Notifications, 3 unread" style="position: relative;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8 M10 20a2 2 0 0 0 4 0"/></svg>
      <span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: #D9890B; box-shadow: 0 0 0 2px #FFFFFF;"></span>
    </button>
    <a href="AIAgents.dc.html" class="tb-key" aria-label="Settings">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
    <button type="button" class="tb-key" aria-label="Colour mode: light. Switch to dark">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
    <a href="Profile.dc.html" aria-label="Your profile" style="width: 36px; height: 36px; border-radius: 18px; background: #8B5CF6; color: #FFFFFF; font: 600 13px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none;">AM</a>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumbs":{"editor":"text","default":"Runs"},"project":{"editor":"text","default":""},"$preview":{"width":1440,"height":76}}'>
class Component extends DCLogic {
renderVals() {
  const project = this.props.project ?? '';
  return { crumbs: this.props.crumbs ?? 'Runs', project, hasProject: !!project };
}
}
</script>
</body>
</html>
