<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio 0.0.1 — sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sp-item:hover{background:#F7F7FB}
.sp-item:focus-visible{outline:2px solid #7750D4;outline-offset:2px}
</style>
</helmet>
<div style="height: 100%; min-height: 560px; font-family: 'Inter', system-ui, sans-serif; color: #0F1020;">
  <div style="width: 236px; height: 100%; box-sizing: border-box; padding: 0 10px 10px;">
    <nav aria-label="Main" style="height: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 22px; box-shadow: 0 0 0 1px rgba(15,16,32,0.11), 0 1px 2px rgba(15,16,32,0.05), 0 10px 28px -18px rgba(15,16,32,0.18); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <a class="sp-item" href="{{it.href}}" aria-current="{{it.cur}}" style="position: relative; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; border-radius: 16px; text-decoration: none; color: {{it.fg}}; background: {{it.bg}};">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="{{it.color}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{it.icon}}"/></svg>
          <span style="flex-grow: 1; font-size: 16px; font-weight: 500; white-space: nowrap;">{{it.label}}</span>
          <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}">
            <span aria-label="{{it.countLabel}}" style="min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #EAF2FE; color: #1D5FC9; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{it.count}}</span>
          </sc-if>
        </a>
      </sc-for>
      <div style="flex-grow: 1;"></div>
      <div style="height: 1px; background: #EEEFF5; margin: 0 4px 6px;"></div>
      <div style="display: flex; flex-direction: column; align-items: stretch; gap: 6px; font-size: 12.5px; padding: 0 4px;">
        <span style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #E8F6EF; color: #157A4B; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1F9D63; flex-shrink: 0;"></span>Spectio 0.0.1 · online</span>
        <span style="padding: 0 12px; color: #4D5065; line-height: 1.45;">Server on {{node}} · your account {{account}}</span>
      </div>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","runs","launch"],"default":"runs"},"$preview":{"width":236,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const active = this.props.active ?? 'runs';
  const defs = [
    ['home', 'Home', 'LiteHome.dc.html', 'M4 13h7V4H4z M13 20h7v-9h-7z M13 4h7v5h-7z M4 20h7v-5H4z', '#5A4FCF', '#F2F1FB'],
    ['runs', 'Runs', 'LiteRuns.dc.html', 'M5 4l14 8-14 8z', '#7750D4', '#F6F2FE'],
    ['launch', 'Launch', 'LiteLaunch.dc.html', 'M12 3v12 M7 8l5-5 5 5 M5 21h14', '#EC5F87', '#FDF2F5']
  ];
  const items = defs.map(([id, label, href, icon, color, tint]) => {
    const on = id === active;
    return { label, href, icon, color, cur: on ? 'page' : 'false', bg: on ? tint : 'transparent', fg: on ? '#0F1020' : '#22253A', hasCount: id === 'runs', count: 6, countLabel: '6 active runs' };
  });
  return { items, node: 'login1', account: 'amartin' };
}
}
</script>
</body>
</html>
