<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio mobile — review queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0 0 auto 0; z-index: 2;"><dc-import name="MobileTopbar" title="Review" sub="12 waiting · oldest 2 h 10" hint-size="390px,60px"></dc-import></div>
  <main style="position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 12px 12px 172px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
    <div role="tablist" aria-label="Review scope" style="display: flex; padding: 4px; border-radius: 16px; background: #EEEFF5;">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="3">
        <span role="tab" aria-selected="{{s.sel}}" style="flex: 1 1 0; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; background: {{s.bg}}; color: {{s.fg}}; box-shadow: {{s.sh}};">{{s.t}}<span style="font-weight: 500; opacity: 0.7;">{{s.n}}</span></span>
      </sc-for>
    </div>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07), 0 1px 2px rgba(15,16,32,0.05); overflow: hidden;">
        <span style="width: 4px; flex-shrink: 0; background: #D9890B;"></span>
        <div style="flex-grow: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
          <a href="MReview.dc.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 3px;">
            <span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;">
              <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.gate}}</span>
              <span style="font-size: 12.5px; font-weight: 600; color: #8F5806; flex-shrink: 0;">{{c.wait}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4D5065; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><img src="{{c.logo}}" width="14" height="14" alt="{{c.engine}}" style="display: block; flex-shrink: 0;">{{c.run}}</span>
          </a>
          <span style="display: flex; align-items: center; gap: 10px;">
            <span role="img" aria-label="{{c.checks}}" style="flex-grow: 1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #EEEFF5;"><span style="width: {{c.p}}; background: #1F9D63;"></span><span style="width: {{c.w}}; background: #F2B544;"></span><span style="width: {{c.x}}; background: #DC3B3B;"></span></span>
            <span style="font-size: 12.5px; color: #33364A; flex-shrink: 0;">{{c.checks}}</span>
          </span>
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 14px; background: {{c.sbg}}; color: {{c.sfg}}; font-size: 12.5px; font-weight: 600;"><span style="width: 20px; height: 20px; border-radius: 10px; background: {{c.tbg}}; color: {{c.tfg}}; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{c.actor}}</span>{{c.sugg}}</span>
            <a href="MReview.dc.html" style="height: 36px; min-width: 76px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; background: {{c.bbg}}; color: {{c.bfg}}; box-shadow: {{c.bring}};">{{c.action}}</a>
          </span>
        </div>
      </div>
    </sc-for>
  </main>
  <div style="position: absolute; left: 8px; right: 8px; bottom: 80px; z-index: 3; height: 60px; box-sizing: border-box; padding: 8px 8px 8px 14px; border-radius: 20px; background: #0F1020; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px -14px rgba(15,16,32,0.6);">
    <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">3 ready</span><span style="font-size: 12px; color: #C4C7D4;">all checks pass</span></span>
    <button type="button" style="height: 44px; padding: 0 18px; border: none; border-radius: 13px; background: #A580F8; color: #0F1020; font: 600 15px 'Inter', sans-serif;">Approve 3</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;"><dc-import name="MobileTabbar" active="review" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const E = { nfcore: ['nf-core', '/_blob/b04c0e1634ffbccff3a43d65ce1316d4'], smk: ['Snakemake', '/_blob/7a35665829f51132cb3bcb9a4c3e638c'] };
  const scope = (t, n, on) => ({ t, n, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0F1020' : '#4D5065', sh: on ? '0 1px 2px rgba(15,16,32,0.15)' : 'none' });
  const A = { ai: ['AI', '#7750D4', '#FFFFFF', '#F6F2FE', '#4D368B'], bot: ['BOT', '#E3F1FB', '#1D5FC9', '#EEF6FA', '#1F536D'] };
  const card = (gate, run, eng, pass, warn, fail, actor, sugg, wait) => {
    const tot = pass + warn + fail, ready = warn + fail === 0;
    const [engine, logo] = E[eng]; const [a, tbg, tfg, sbg, sfg] = A[actor];
    return { gate, run, engine, logo, wait, checks: pass + ' / ' + tot + ' pass', p: (pass / tot * 100) + '%', w: (warn / tot * 100) + '%', x: (fail / tot * 100) + '%',
      actor: a, tbg, tfg, sbg, sfg, sugg, action: ready ? 'Approve' : 'Open',
      bbg: ready ? '#ECF8F1' : '#FFFFFF', bfg: ready ? '#0E5A37' : '#22253A', bring: ready ? 'inset 0 0 0 1px #9FD9BA' : 'inset 0 0 0 1px #DFE1EA' };
  };
  return {
    scopes: [scope('Mine', '5', true), scope('My groups', '4'), scope('All', '12')],
    cards: [
      card('Segmentation QC', 'imaging-cellpose · plate 07', 'smk', 9, 1, 2, 'ai', 'adjust diameter', '47 min'),
      card('Segmentation QC', 'imaging-cellpose · plate 08', 'smk', 12, 0, 0, 'ai', 'approve', '41 min'),
      card('Segmentation QC', 'imaging-cellpose · plate 09', 'smk', 12, 0, 0, 'ai', 'approve', '38 min'),
      card('Coverage check', 'sarek-trio-02', 'nfcore', 8, 1, 3, 'bot', 'new data tomorrow', '2 h 10'),
      card('Mapping QC', 'rnaseq-liver-tc-04', 'nfcore', 12, 0, 0, 'ai', 'approve', '22 min'),
      card('Library QC', 'proteomics-dia-11', 'nfcore', 6, 2, 0, 'bot', 'signal pending', '6 min')
    ]
  };
}
}
</script>
</body>
</html>
