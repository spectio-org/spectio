<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectio mobile — runner offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main > *{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7FB; color: #0F1020; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; inset: 0 0 auto 0; z-index: 2;"><dc-import name="MobileTopbar" title="Runner offline" sub="hpc-login-2 · EMBL SLURM" back="MEnvironments.dc.html" hint-size="390px,60px"></dc-import></div>
  <main style="position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 12px 12px 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
    <section style="border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 4px 0 #DC3B3B, 0 0 0 1px rgba(15,16,32,0.07); padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 8px;">
      <span style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FCEBEB; color: #B02A2A; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7V3 M15 7V3 M6 7h12v4a6 6 0 0 1-12 0z M12 17v4 M3 3l18 18"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600; color: #B02A2A;">No contact for 18 min</span><span style="font-size: 12.5px; color: #4D5065;">Last heartbeat 10:04 · spectio-runner 0.1.0</span></span>
      </span>
      <div role="img" aria-label="Regular heartbeats, then none since 10:04" style="display: flex; gap: 2px; height: 16px;">
        <sc-for list="{{beats}}" as="b" hint-placeholder-count="40"><span style="flex: 1 1 0; border-radius: 2px; background: {{b}};"></span></sc-for>
      </div>
      <span style="display: flex; justify-content: space-between; font-size: 11.5px; color: #6E7287;"><span>08:22</span><span>now 10:22</span></span>
    </section>

    <section style="border-radius: 16px; background: #E8F6EF; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #0E5A37; display: flex; align-items: center; gap: 8px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Still working</h2>
      <sc-for list="{{works}}" as="w" hint-placeholder-count="3"><span style="font-size: 13.5px; line-height: 1.4; color: #22253A;">{{w}}</span></sc-for>
    </section>
    <section style="border-radius: 16px; background: #FDF3E2; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #6B4205; display: flex; align-items: center; gap: 8px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14 M15 5v14"/></svg>On hold until it is back</h2>
      <sc-for list="{{held}}" as="w" hint-placeholder-count="4"><span style="font-size: 13.5px; line-height: 1.4; color: #22253A;">{{w}}</span></sc-for>
    </section>

    <h2 style="margin: 6px 2px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #4D5065;">AFFECTED RUNS</h2>
    <sc-for list="{{runs}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07); overflow: hidden;">
        <span style="width: 4px; flex-shrink: 0; background: {{r.rail}};"></span>
        <div style="flex-grow: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; min-width: 0;"><img src="{{r.logo}}" width="15" height="15" alt="" style="display: block; flex-shrink: 0;">{{r.name}}</span>
            <span style="font-size: 12.5px; font-weight: 600; color: {{r.fg}}; white-space: nowrap;">{{r.state}}</span>
          </span>
          <span style="font-size: 12.5px; color: #33364A; line-height: 1.4;">{{r.effect}}</span>
          <a href="{{r.href}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 11px; background: {{r.bbg}}; color: {{r.bfg}}; box-shadow: {{r.bring}}; font-size: 13.5px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">{{r.action}}</a>
        </div>
      </div>
    </sc-for>

    <section style="border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px;"><span style="width: 30px; height: 30px; border-radius: 9px; background: #F6F2FE; color: #6344B2; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3 M4 4v4h4 M4 13a8 8 0 0 0 14.9 3 M20 20v-4h-4"/></svg></span>Bring it back</h2>
      <span style="font-size: 13px; color: #33364A;">Run once on the login node:</span>
      <div style="display: flex; gap: 6px;">
        <code style="flex-grow: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: #0F1020; color: #E6E7EF; border-radius: 10px; padding: 11px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">spectio runner start --daemon</code>
        <button type="button" style="width: 48px; border: none; border-radius: 10px; background: #F6F2FE; color: #4D368B; font: 600 12.5px 'Inter', sans-serif;">Copy</button>
      </div>
      <a href="#" style="height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 1px #D8C8FC; color: #4D368B; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Set up auto-restart</a>
    </section>

    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15,16,32,0.07); font-size: 15px; font-weight: 500;">
      Notify me when it is back
      <span style="width: 46px; height: 28px; border-radius: 14px; background: #7750D4; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 3px; left: 21px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,16,32,0.25);"></span></span>
    </label>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;"><dc-import name="MobileTabbar" active="more" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const beats = Array.from({ length: 40 }, (_, i) => i < 34 ? (i === 15 ? '#F2B544' : '#7FCFA6') : '#F2B8B8');
  const L = { nfcore: '/_blob/b04c0e1634ffbccff3a43d65ce1316d4', smk: '/_blob/7a35665829f51132cb3bcb9a4c3e638c' };
  const prim = ['#7750D4', '#FFFFFF', 'none'], quiet = ['#FFFFFF', '#22253A', 'inset 0 0 0 1px #DFE1EA'];
  const run = (name, logo, state, rail, fg, effect, action, href, b) => ({ name, logo, state, rail, fg, effect, action, href, bbg: b[0], bfg: b[1], bring: b[2] });
  return {
    beats,
    works: [
      'Running workflows keep computing: each engine runs as its own SLURM job.',
      'Live monitoring continues: engines send events straight to the server.',
      'Published results can still be opened.'
    ],
    held: [
      'New launches on this runner (1 queued).',
      'Cancel, pause and continue: queued, applied on reconnect.',
      'Viewers on work-directory files.',
      'Storage measurements and cleanup.'
    ],
    runs: [
      run('sarek-trio-02', L.nfcore, 'Running', '#3B82F6', '#1D5FC9', 'Still computing. Cancel and pause wait for the runner.', 'Open', 'MRunDetail.dc.html', quiet),
      run('atac-batch-08', L.smk, 'Queued', '#6E7287', '#33364A', 'hpc-login-1 (same cluster, same storage) can take it now.', 'Move to hpc-login-1', '#', prim),
      run('proteomics-dia-11', L.nfcore, 'Awaiting review', '#D9890B', '#8F5806', 'Decide now; it is applied when the runner reconnects.', 'Review', 'MReview.dc.html', quiet)
    ]
  };
}
}
</script>
</body>
</html>
