site_name: Spectio
site_description: Launch, monitor and steer Nextflow and Snakemake runs, with QC gates, a headless API and depictio integration.
site_url: https://spectio.pages.dev/
repo_url: https://github.com/spectio-org/spectio
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
# A local Excalifont.ttf, ignored by version control (tools/diagrams/FONT-LICENSE.md), never goes into the site.
exclude_docs: |
  fonts/*.ttf
  # read by the Snakemake plugin catalogue from the root of main, not part of the site
  /intro.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/emblem.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra:
  build_sha: !ENV [SPECTIO_BUILD_SHA, local]
  preview: !ENV [SPECTIO_PREVIEW, local]

extra_css:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css
  - stylesheets/extra.css
  - stylesheets/asciinema.css
extra_javascript:
  - javascripts/asciinema.js

hooks:
  - hooks/progress.py
  - hooks/lists.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Installation: installation/index.md
  - Usage:
      - usage/index.md
      - Signing in: usage/sign-in.md
      - Keeping the server running: usage/keep-the-server-running.md
      - Opening from your laptop: usage/open-from-your-laptop.md
      - Runs started from a terminal: usage/runs-from-a-terminal.md
      - States, outputs and efficiency: usage/states-outputs-efficiency.md
      - Browsing and previewing files: usage/browse-and-preview-files.md
      - Environments: usage/environments.md
      - Your profile: usage/profile.md
      - Your pipeline catalog: usage/pipeline-catalog.md
  - Features:
      - features/index.md
      - Runs: features/runs.md
      - Runners: features/runners.md
      - QC gates (optional): features/gates.md
      - Administration: features/administration.md
      - depictio: features/depictio.md
  - API: api/index.md
  - Developer:
      - developer/index.md
      - Documentation map: map.md
      - Claim the package names: developer/claim-package-names.md
      - Glossary: glossary.md
      - Progress: progress/index.md
      - Specifications:
          - "MVP 0.0.1": specs/mvp-0.0.1.md
          - Synthesis: specs/synthesis.md
          - UI spec: specs/ui-spec.md
          - Checking scenarios: specs/checking-scenarios.md
          - API and data model: specs/api-and-data-model.md
          - Authentication and access: specs/authentication-and-access.md
          - Plugins and packaging: specs/architecture-plugins-and-packaging.md
          - Schedulers and monitoring: specs/schedulers-and-monitoring.md
          - Administration and operations: specs/admin-and-operations.md
          - Telemetry and analytics: specs/telemetry-and-analytics.md
          - CLI and shared libraries: specs/cli-and-shared-libraries.md
          - depictio ecosystem reuse: specs/depictio-ecosystem-reuse.md
          - Dev environment and testing: specs/dev-environment-and-testing.md
          - Documentation system: specs/documentation-system.md
      - Decisions:
          - How decisions are recorded: decisions/README.md
          - Decision log: decisions/log.md
          - "0001: Nextflow through nf-spectio": decisions/0001-nextflow-through-nf-spectio.md
  - Roadmap: roadmap/index.md
  - Changelog: changelog/index.md
