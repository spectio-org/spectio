site_name: Spectio
site_description: Launch, monitor and steer Nextflow and Snakemake runs, with QC gates, a headless API and depictio integration.
site_url: https://weber8thomas.github.io/spectio/
repo_url: https://github.com/weber8thomas/spectio
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/emblem.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css
  - stylesheets/extra.css
  - stylesheets/asciinema.css
extra_javascript:
  - javascripts/asciinema.js

hooks:
  - hooks/progress.py
  - hooks/lists.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Specifications:
      - Documentation map: map.md
      - Synthesis: specs/synthesis.md
      - UI spec: specs/ui-spec.md
      - Checking scenarios: specs/checking-scenarios.md
      - API and data model: specs/api-and-data-model.md
      - Authentication and access: specs/authentication-and-access.md
      - Plugins and packaging: specs/architecture-plugins-and-packaging.md
      - Schedulers and monitoring: specs/schedulers-and-monitoring.md
      - Administration and operations: specs/admin-and-operations.md
      - Telemetry and analytics: specs/telemetry-and-analytics.md
      - CLI and shared libraries: specs/cli-and-shared-libraries.md
      - depictio ecosystem reuse: specs/depictio-ecosystem-reuse.md
      - Dev environment and testing: specs/dev-environment-and-testing.md
      - Documentation system: specs/documentation-system.md
  - Progress:
      - progress/index.md
  - Playbooks:
      - Autopilot: playbooks/autopilot.md
      - Triage policy: playbooks/triage-policy.md
      - Next phase (step prompts): playbooks/next-phase.md
  - Reviews:
      - Format: reviews/README.md
      - Inbox (questions for Thomas): reviews/inbox.md
  - Decisions:
      - How decisions are recorded: decisions/README.md
      - Decision log: decisions/log.md
  - Research:
      - depictio harmonisation: research/depictio-harmonization.md
      - depictio administration and operations: research/depictio-admin-ops.md
      - depictio CLI and packaging, LabID: research/depictio-cli-packaging.md
      - depictio frontend and branding: research/depictio-frontend-admin.md
      - depictio authentication: research/depictio-auth-2026-10-26.md
      - depictio docs system: research/depictio-docs-system-2026-10-26.md
      - Test corpus and CI: research/corpus-and-ci-2026-10-26.md
      - Budget governor and telemetry: research/budget-and-telemetry-2026-10-26.md
      - "Spike: synthetic pipelines": research/spike-synthetic-pipelines-2026-10-26.md
      - "Spike: docs media tooling": research/spike-docs-media-tooling-2026-10-26.md
  - Changelog: changelog/index.md
