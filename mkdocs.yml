site_name: Spectio
site_description: Launch, monitor and steer Nextflow and Snakemake runs, with QC gates, a headless API and depictio integration.
site_url: https://weber8thomas.github.io/spectio/
repo_url: https://github.com/weber8thomas/spectio
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
# A local Virgil.ttf, ignored by version control (tools/diagrams/FONT-LICENSE.md), never goes into the site.
exclude_docs: |
  fonts/*.ttf

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/emblem.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra:
  build_sha: !ENV [SPECTIO_BUILD_SHA, local]
  preview: !ENV [SPECTIO_PREVIEW, local]

extra_css:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css
  - stylesheets/extra.css
  - stylesheets/asciinema.css
extra_javascript:
  - javascripts/asciinema.js

hooks:
  - hooks/progress.py
  - hooks/lists.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn

