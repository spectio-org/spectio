# osv-scanner exceptions for gradle/verification-metadata.xml, the only lockfile in this
# directory. Accepted by Thomas, 2026-11-07 (PR #148; docs/decisions/log.md, same date).
#
# That file pins what the Gradle build of nf-spectio downloads: the io.nextflow.nextflow-plugin
# and the compile classpath of nextflow-25.04.0 (the floor of architecture §13.4). None of it
# ships: the plugin zip bundles no library (tests/packaging/test_bridges_release.sh fails on any
# lib/ entry), and at run time the plugin uses the jars of the user's own Nextflow. The code runs
# only on the build machine, on our own sources.
#
# One entry per known vulnerability, so a new one still fails the audit. Each expires on
# 2027-05-07: review the list then, and whenever nextflowVersion or the Gradle plugin changes.
# Remove an entry if its library starts to ship in the zip.

