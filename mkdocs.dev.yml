# The full site, developer pages included: `uvx --with mkdocs-material mkdocs build --strict -f mkdocs.dev.yml`.
# mkdocs.yml is the public site (product pages only); documentation-system.md §1.
INHERIT: mkdocs.yml
site_name: Spectio (developer build)

# Only the original exclusions: the developer folders are built here.
exclude_docs: |
  fonts/*.ttf
